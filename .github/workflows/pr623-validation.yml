name: PR 623 Full Validation

on:
  pull_request:
    branches: [main]
    paths:
      - 'index.html'
      - 'config.js'
      - 'scripts/**'
      - 'tests/**'
      - 'package.json'
      - 'package-lock.json'
      - 'vercel.json'
      - 'ops/**'
      - '.vercel/**'
      - '.github/workflows/pr623-validation.yml'

permissions:
  contents: read

jobs:
  validate:
    if: github.event.pull_request.number == 623
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VALIDATION_DIR: /tmp/pr623-validation
    steps:
      - name: Checkout PR head
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Vercel CLI required by release guard
        run: npm install --global vercel@latest

      - name: Prepare canonical Vercel project link
        shell: bash
        run: |
          test -n "$VERCEL_TOKEN"
          test -n "$VERCEL_ORG_ID"
          test -n "$VERCEL_PROJECT_ID"
          mkdir -p .vercel
          node <<'NODE'
          const fs = require('fs');
          const manifest = JSON.parse(fs.readFileSync('ops/deployment-manifest.json', 'utf8'));
          const expectedProjectId = manifest.deploy && manifest.deploy.projectId;
          const projectName = manifest.deploy && manifest.deploy.projectName;
          if (!expectedProjectId || !projectName) {
            throw new Error('deployment manifest is missing deploy.projectId or deploy.projectName');
          }
          if (process.env.VERCEL_PROJECT_ID !== expectedProjectId) {
            throw new Error('VERCEL_PROJECT_ID does not match the canonical deployment manifest');
          }
          fs.writeFileSync(
            '.vercel/project.json',
            `${JSON.stringify({ orgId: process.env.VERCEL_ORG_ID, projectId: process.env.VERCEL_PROJECT_ID, projectName }, null, 2)}\n`
          );
          NODE

      - name: Prepare validation evidence directory
        run: mkdir -p "$VALIDATION_DIR"

      - name: Run repository tests
        shell: bash
        run: |
          set +e
          node --test tests/*.test.* > "$VALIDATION_DIR/tests.log" 2>&1
          code=$?
          echo "$code" > "$VALIDATION_DIR/tests.exit"
          exit 0

      - name: Run build check
        shell: bash
        run: |
          set +e
          npm run build > "$VALIDATION_DIR/build.log" 2>&1
          code=$?
          echo "$code" > "$VALIDATION_DIR/build.exit"
          exit 0

      - name: Run release guard
        shell: bash
        run: |
          set +e
          bash scripts/release-guard.sh > "$VALIDATION_DIR/release-guard.log" 2>&1
          code=$?
          echo "$code" > "$VALIDATION_DIR/release-guard.exit"
          exit 0

      - name: Build concise validation summary
        if: always()
        shell: bash
        run: |
          {
            echo "tests_exit=$(cat "$VALIDATION_DIR/tests.exit" 2>/dev/null || echo missing)"
            echo "build_exit=$(cat "$VALIDATION_DIR/build.exit" 2>/dev/null || echo missing)"
            echo "release_guard_exit=$(cat "$VALIDATION_DIR/release-guard.exit" 2>/dev/null || echo missing)"
            echo
            echo "=== TESTS TAIL ==="
            tail -n 40 "$VALIDATION_DIR/tests.log" 2>/dev/null || true
            echo
            echo "=== BUILD TAIL ==="
            tail -n 40 "$VALIDATION_DIR/build.log" 2>/dev/null || true
            echo
            echo "=== RELEASE GUARD TAIL ==="
            tail -n 80 "$VALIDATION_DIR/release-guard.log" 2>/dev/null || true
          } | tee "$VALIDATION_DIR/summary.txt"

      - name: Upload validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pr623-full-validation-${{ github.run_id }}
          path: /tmp/pr623-validation/
          if-no-files-found: error

      - name: Enforce validation result
        if: always()
        shell: bash
        run: |
          tests=$(cat "$VALIDATION_DIR/tests.exit" 2>/dev/null || echo 99)
          build=$(cat "$VALIDATION_DIR/build.exit" 2>/dev/null || echo 99)
          guard=$(cat "$VALIDATION_DIR/release-guard.exit" 2>/dev/null || echo 99)
          test "$tests" = 0
          test "$build" = 0
          test "$guard" = 0
