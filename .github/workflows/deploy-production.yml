name: Deploy Production Fallback

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "Git ref to deploy"
        required: false
        default: "main"
      expected_sha:
        description: "Expected commit SHA to verify before deploy"
        required: false
        default: ""
      reason:
        description: "Why this fallback deploy was triggered"
        required: false
        default: "fallback production deploy"

permissions:
  contents: read
  deployments: write

concurrency:
  group: production-deploy-${{ github.repository }}
  cancel-in-progress: false

jobs:
  deploy-production:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      PRODUCTION_URL: https://ezohata-incoming-ledger.vercel.app/
      STATUS_URL: https://ezohata-incoming-ledger.vercel.app/api/status

    steps:
      - name: Checkout selected ref
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Print checked-out commit
        run: |
          echo "ref=${{ inputs.ref }}"
          echo "reason=${{ inputs.reason }}"
          echo "expected_sha=${{ inputs.expected_sha }}"
          echo "actual_sha=$(git rev-parse HEAD)"
          git log -1 --oneline

      - name: Verify expected SHA if provided
        if: ${{ inputs.expected_sha != '' }}
        run: |
          ACTUAL_SHA="$(git rev-parse HEAD)"
          if [ "$ACTUAL_SHA" != "${{ inputs.expected_sha }}" ]; then
            echo "Expected SHA does not match checked-out SHA"
            echo "expected=${{ inputs.expected_sha }}"
            echo "actual=$ACTUAL_SHA"
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Verify Vercel fallback credentials
        run: |
          missing=0
          for name in VERCEL_TOKEN VERCEL_ORG_ID VERCEL_PROJECT_ID; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is not configured for this repository or environment."
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 1
          fi

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Prepare Vercel project link
        run: |
          mkdir -p .vercel
          node <<'NODE'
          const fs = require("fs");
          const required = ["VERCEL_ORG_ID", "VERCEL_PROJECT_ID"];
          const missing = required.filter((name) => !process.env[name]);
          if (missing.length) {
            console.error(`Missing required Vercel link values: ${missing.join(", ")}`);
            process.exit(1);
          }
          fs.writeFileSync(
            ".vercel/project.json",
            `${JSON.stringify({
              orgId: process.env.VERCEL_ORG_ID,
              projectId: process.env.VERCEL_PROJECT_ID,
              projectName: "ezohata-incoming-ledger",
            }, null, 2)}\n`
          );
          NODE

      - name: Run release guard
        run: bash scripts/release-guard.sh

      - name: Run tests
        run: npm test

      - name: Run build check
        run: npm run build

      - name: Pull Vercel production environment
        run: npx vercel@latest pull --yes --environment=production --token "$VERCEL_TOKEN"

      - name: Build with Vercel
        run: npx vercel@latest build --prod --token "$VERCEL_TOKEN"

      - name: Deploy prebuilt to Vercel production
        run: |
          DEPLOY_URL="$(npx vercel@latest deploy --prebuilt --prod --yes --token "$VERCEL_TOKEN")"
          echo "DEPLOY_URL=$DEPLOY_URL" >> "$GITHUB_ENV"
          echo "Vercel deploy URL: $DEPLOY_URL"

      - name: Wait for production alias
        run: sleep 60

      - name: Verify production URL responds
        run: curl -fsS --retry 6 --retry-delay 10 "$PRODUCTION_URL" >/dev/null

      - name: Verify status endpoint responds
        run: curl -fsS --retry 6 --retry-delay 10 "$STATUS_URL" >/tmp/status.json && cat /tmp/status.json

      - name: Verify production serves this commit
        run: npm run verify:production -- $(git rev-parse HEAD)

      - name: Deployment summary
        if: always()
        run: |
          {
            echo "## Production Deploy Fallback"
            echo "- Repository: ${{ github.repository }}"
            echo "- Ref: ${{ inputs.ref }}"
            echo "- Expected SHA: ${{ inputs.expected_sha }}"
            echo "- Actual SHA: $(git rev-parse HEAD)"
            echo "- Reason: ${{ inputs.reason }}"
            echo "- Deploy URL: ${DEPLOY_URL:-unknown}"
            echo "- Production URL: $PRODUCTION_URL"
            echo "- Status URL: $STATUS_URL"
          } >> "$GITHUB_STEP_SUMMARY"
