name: Verify PayPal Loading Live

on:
  pull_request:
    paths:
      - '.github/workflows/paypal-loading-live-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Capture exact production asset evidence
        shell: bash
        run: |
          cat > /tmp/diagnose-paypal-loading-live.mjs <<'EOF'
          import fs from 'node:fs';
          import crypto from 'node:crypto';

          const productionUrl = 'https://ezohata-incoming-ledger.vercel.app/';
          const assetUrl = `${productionUrl}paypal-derived-balance-loading-fix.js`;
          const canonicalAsset = fs.readFileSync('paypal-derived-balance-loading-fix.js', 'utf8').replace(/\r\n/g, '\n').trim();
          const hash = (value) => crypto.createHash('sha256').update(value).digest('hex');
          const result = {
            productionUrl,
            assetUrl,
            canonicalAssetSha256: hash(canonicalAsset),
            liveAssetSha256: null,
            indexStatus: null,
            assetStatus: null,
            indexLoadsAsset: false,
            assetMatchesCanonical: false,
            exportedApiMarkers: {},
            failures: [],
          };

          const indexResponse = await fetch(`${productionUrl}?verification=${Date.now()}`, {
            headers: { 'cache-control': 'no-cache' },
          });
          result.indexStatus = indexResponse.status;
          const liveIndex = await indexResponse.text();
          result.indexLoadsAsset = liveIndex.includes('paypal-derived-balance-loading-fix.js');
          if (!indexResponse.ok) result.failures.push(`index_status: ${indexResponse.status}`);
          if (!result.indexLoadsAsset) result.failures.push('index_asset_reference: missing');

          const assetResponse = await fetch(`${assetUrl}?verification=${Date.now()}`, {
            headers: { 'cache-control': 'no-cache' },
          });
          result.assetStatus = assetResponse.status;
          const liveAsset = await assetResponse.text();
          if (!assetResponse.ok) {
            result.failures.push(`asset_status: ${assetResponse.status}`);
          } else {
            const normalized = liveAsset.replace(/\r\n/g, '\n').trim();
            result.liveAssetSha256 = hash(normalized);
            result.assetMatchesCanonical = normalized === canonicalAsset;
            result.exportedApiMarkers = {
              lifecycleApi: normalized.includes('EzohataPayPalDerivedBalanceLoadingFix'),
              boundedTimeout: normalized.includes('const TIMEOUT_MS = 30000'),
              finalRender: normalized.includes('expenseState.paypalDerivedBalanceLoading = false;') && normalized.includes('render();'),
            };
            if (!result.assetMatchesCanonical) result.failures.push('asset_hash: deployed asset differs from canonical main');
            for (const [key, value] of Object.entries(result.exportedApiMarkers)) {
              if (!value) result.failures.push(`asset_marker: ${key}`);
            }
          }

          fs.writeFileSync('/tmp/paypal-loading-live-diagnostic.json', JSON.stringify(result, null, 2));
          console.log(JSON.stringify(result, null, 2));
          if (result.failures.length) process.exit(1);
          EOF
          set -o pipefail
          node /tmp/diagnose-paypal-loading-live.mjs 2>&1 | tee /tmp/paypal-loading-live-diagnostic.log

      - name: Preserve diagnostic evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paypal-loading-live-diagnostic-${{ github.run_id }}
          path: |
            /tmp/paypal-loading-live-diagnostic.json
            /tmp/paypal-loading-live-diagnostic.log
          if-no-files-found: ignore
