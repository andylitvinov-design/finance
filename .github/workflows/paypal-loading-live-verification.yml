name: Verify PayPal Loading Live

on:
  pull_request:
    paths:
      - '.github/workflows/paypal-loading-live-verification.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-live:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install browser verification runtime
        run: |
          npm install --no-save --ignore-scripts playwright@1.54.1
          npx playwright install --with-deps chromium

      - name: Verify deployed asset in clean desktop and mobile browser contexts
        shell: bash
        run: |
          cat > .verification-paypal-loading-live.mjs <<'EOF'
          import fs from 'node:fs';
          import crypto from 'node:crypto';
          import { chromium } from 'playwright';

          const productionUrl = 'https://ezohata-incoming-ledger.vercel.app/';
          const assetUrl = `${productionUrl}paypal-derived-balance-loading-fix.js`;
          const canonicalAsset = fs.readFileSync('paypal-derived-balance-loading-fix.js', 'utf8').replace(/\r\n/g, '\n').trim();
          const hash = (value) => crypto.createHash('sha256').update(value).digest('hex');

          const indexResponse = await fetch(`${productionUrl}?verification=${Date.now()}`, { headers: { 'cache-control': 'no-cache' } });
          if (!indexResponse.ok) throw new Error(`production index returned ${indexResponse.status}`);
          const liveIndex = await indexResponse.text();
          if (!liveIndex.includes('paypal-derived-balance-loading-fix.js')) throw new Error('production index does not load the lifecycle asset');

          const assetResponse = await fetch(`${assetUrl}?verification=${Date.now()}`, { headers: { 'cache-control': 'no-cache' } });
          if (!assetResponse.ok) throw new Error(`production asset returned ${assetResponse.status}`);
          const liveAsset = (await assetResponse.text()).replace(/\r\n/g, '\n').trim();
          if (liveAsset !== canonicalAsset) throw new Error(`deployed asset hash ${hash(liveAsset)} differs from canonical ${hash(canonicalAsset)}`);

          const viewports = [
            { name: 'desktop', width: 1440, height: 1000 },
            { name: 'mobile', width: 390, height: 844 },
          ];
          const browser = await chromium.launch({ headless: true });
          const results = [];
          try {
            for (const viewport of viewports) {
              const context = await browser.newContext({ viewport, serviceWorkers: 'block' });
              const page = await context.newPage();
              const consoleErrors = [];
              const failedRequests = [];
              const badResponses = [];
              page.on('console', (message) => { if (message.type() === 'error') consoleErrors.push(message.text()); });
              page.on('requestfailed', (request) => failedRequests.push(`${request.method()} ${request.url()} ${request.failure()?.errorText || ''}`));
              page.on('response', (response) => { if (response.status() >= 400) badResponses.push(`${response.status()} ${response.url()}`); });
              await page.goto('about:blank');
              await page.addScriptTag({ url: `${assetUrl}?browser=${viewport.name}-${Date.now()}` });

              const evidence = await page.evaluate(async () => {
                const api = globalThis.EzohataPayPalDerivedBalanceLoadingFix;
                if (!api || typeof api.createPayPalDerivedBalanceRunner !== 'function') throw new Error('deployed lifecycle API is unavailable');

                function harness(overrides = {}) {
                  const state = { paypalDerivedBalanceLoading: false, paypalManualBalanceRequired: false };
                  const statuses = [];
                  const renders = [];
                  let loads = 0;
                  const runner = api.createPayPalDerivedBalanceRunner({
                    normalizeDate: (value) => value,
                    getStartDate: () => '2026-05-20',
                    getEndDate: () => '2026-05-21',
                    expenseState: state,
                    setStatus: (message, error) => statuses.push({ message, error }),
                    render: () => renders.push(state.paypalDerivedBalanceLoading),
                    fetchImpl: async () => ({ ok: true, status: 200, json: async () => ({ ok: true, provider_results: [{ provider: 'paypal', writable_rows: 2 }] }) }),
                    loadDashboard: async () => { loads += 1; },
                    AbortControllerImpl: class { constructor() { this.signal = { aborted: false }; } abort() { this.signal.aborted = true; } },
                    setTimeoutImpl: () => 99,
                    clearTimeoutImpl: () => {},
                    ...overrides,
                  });
                  return { runner, state, statuses, renders, loads: () => loads };
                }

                const success = harness();
                await success.runner();
                if (success.state.paypalDerivedBalanceLoading !== false || JSON.stringify(success.renders) !== JSON.stringify([true, false]) || success.loads() !== 1) throw new Error(`success lifecycle mismatch ${JSON.stringify(success.renders)}`);

                const apiError = harness({ fetchImpl: async () => ({ ok: false, status: 503, json: async () => ({ ok: false, error: 'provider unavailable' }) }) });
                await apiError.runner();
                if (apiError.state.paypalDerivedBalanceLoading !== false || apiError.statuses.at(-1)?.message !== 'provider unavailable') throw new Error('structured error lifecycle mismatch');

                let controller;
                const timeout = harness({
                  AbortControllerImpl: class { constructor() { this.signal = { aborted: false }; controller = this; } abort() { this.signal.aborted = true; } },
                  setTimeoutImpl: (callback, delay) => { if (delay !== api.TIMEOUT_MS) throw new Error(`unexpected timeout ${delay}`); callback(); return 7; },
                  fetchImpl: async (_url, options) => { if (options.signal !== controller.signal || !options.signal.aborted) throw new Error('abort signal mismatch'); const error = new Error('aborted'); error.name = 'AbortError'; throw error; },
                });
                await timeout.runner();
                if (timeout.state.paypalDerivedBalanceLoading !== false || !timeout.statuses.at(-1)?.message.includes('30 секунд')) throw new Error('timeout lifecycle mismatch');

                const missingDate = harness({ getStartDate: () => '', getEndDate: () => '', normalizeDate: () => '' });
                await missingDate.runner();
                if (missingDate.state.paypalDerivedBalanceLoading !== false || JSON.stringify(missingDate.renders) !== JSON.stringify([false])) throw new Error('missing-date lifecycle mismatch');

                return {
                  success: { loading: success.state.paypalDerivedBalanceLoading, renders: success.renders, status: success.statuses.at(-1) },
                  apiError: { loading: apiError.state.paypalDerivedBalanceLoading, renders: apiError.renders, status: apiError.statuses.at(-1) },
                  timeout: { loading: timeout.state.paypalDerivedBalanceLoading, renders: timeout.renders, status: timeout.statuses.at(-1) },
                  missingDate: { loading: missingDate.state.paypalDerivedBalanceLoading, renders: missingDate.renders, status: missingDate.statuses.at(-1) },
                };
              });

              if (consoleErrors.length) throw new Error(`${viewport.name}: console errors: ${consoleErrors.join(' | ')}`);
              if (failedRequests.length) throw new Error(`${viewport.name}: failed requests: ${failedRequests.join(' | ')}`);
              if (badResponses.length) throw new Error(`${viewport.name}: HTTP errors: ${badResponses.join(' | ')}`);
              results.push({ viewport: viewport.name, evidence, consoleErrors, failedRequests, badResponses });
              await context.close();
            }
          } finally {
            await browser.close();
          }

          const summary = {
            productionUrl,
            deployedAssetUrl: assetUrl,
            canonicalAssetSha256: hash(canonicalAsset),
            liveAssetSha256: hash(liveAsset),
            indexLoadsAsset: true,
            cleanSession: true,
            results,
          };
          fs.writeFileSync('/tmp/paypal-loading-live-evidence.json', JSON.stringify(summary, null, 2));
          console.log(JSON.stringify(summary, null, 2));
          EOF
          set -o pipefail
          node .verification-paypal-loading-live.mjs 2>&1 | tee /tmp/paypal-loading-live.log

      - name: Preserve verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: paypal-loading-live-evidence-${{ github.run_id }}
          path: |
            /tmp/paypal-loading-live-evidence.json
            /tmp/paypal-loading-live.log
          if-no-files-found: ignore
