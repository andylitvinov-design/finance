name: Binance May Gap Apply

on:
  push:
    branches: [binance-may-gap-fix]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node --check scripts/apply-binance-may-gap-fix.cjs
      - run: node scripts/apply-binance-may-gap-fix.cjs
      - run: node --test tests/auto-balance-snapshots.test.mjs tests/period-balance-reconciliation-engine.test.mjs
      - uses: EndBug/add-and-commit@v9
        with:
          add: 'server/auto-balance-snapshots.js server/period-balance-reconciliation-engine.js tests/auto-balance-snapshots.test.mjs tests/period-balance-reconciliation-engine.test.mjs'
          message: 'Fix Binance May reconciliation gaps'
