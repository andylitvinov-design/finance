      async function ensureGoogleAccess(interactive = true) {
        if (!state.googleAuth.configured) {
          throw new Error("Google OAuth client is not configured in sheet-config.json yet.");
        }
        if (!state.googleAuth.accessToken) {
          await connectGoogle(interactive);
        }
        if (!state.googleAuth.accessToken) {
          throw new Error("Google is not connected.");
        }
      }

      async function googleSheetsFetch(path, options = {}) {
        if (!state.googleAuth.accessToken) {
          await connectGoogle(true);
        }
        const response = await fetch(`https://sheets.googleapis.com/v4${path}`, {
          ...options,
          headers: {
            Authorization: `Bearer ${state.googleAuth.accessToken}`,
            "Content-Type": "application/json",
            ...(options.headers || {})
          }
        });
        const text = await response.text();
        let payload = {};
        try {
          payload = text ? JSON.parse(text) : {};
        } catch {
          payload = {};
        }
        if (!response.ok) {
          const message = payload?.error?.message || `Google Sheets API HTTP ${response.status}`;
          if (response.status === 401) {
            state.googleAuth.accessToken = "";
            refreshAuthButtons();
          }
          throw new Error(message);
        }
        return payload;
      }

      async function listManualSheetDatesDirect() {
        const sheetMeta = await getManualSpreadsheetMetadata();
        const periods = [];
        const dates = [];
        for (const sheet of sheetMeta.sheets || []) {
          const title = sheet?.properties?.title || "";
          const period = parseManualPeriodSheetName(title);
          if (period) {
            periods.push({ ...period, sheetName: title });
          } else if (MANUAL_DATE_RE.test(title)) {
            dates.push(title);
          }
        }
        periods.sort((a, b) => (a.endDate === b.endDate ? (a.startDate < b.startDate ? 1 : -1) : (a.endDate < b.endDate ? 1 : -1)));
        dates.sort().reverse();
        return {
          periods,
          dates,
          spreadsheetUrl: state.config?.manualFinance?.spreadsheetUrl || "",
          title: state.config?.manualFinance?.title || "EzoHata Manual Inputs",
          writeEnabled: true
        };
      }

      async function getManualSpreadsheetMetadata() {
        return await getSpreadsheetMetadata(getManualFinanceSpreadsheetId());
      }

      async function getSpreadsheetMetadata(spreadsheetId) {
        if (!spreadsheetId) {
          throw new Error("Spreadsheet ID is not configured.");
        }
        return await googleSheetsFetch(`/spreadsheets/${spreadsheetId}?fields=spreadsheetId,sheets(properties(sheetId,title,index,hidden))`);
      }

      function parseManualPeriodSheetName(value) {
        const match = MANUAL_PERIOD_SHEET_RE.exec(String(value || "").trim());
        if (!match) return null;
        return { startDate: match[1], endDate: match[2], status: match[3] };
      }

      async function getManualSheetDirect(startDate, endDate) {
        const period = normalizePeriod(startDate, endDate);
        const metadata = await getManualSpreadsheetMetadata();
        const titles = new Set((metadata.sheets || []).map((sheet) => sheet?.properties?.title || ""));
        const closedName = buildManualPeriodSheetName(period.startDate, period.endDate, "closed");
        const draftName = buildManualPeriodSheetName(period.startDate, period.endDate, "draft");
        const legacyName = period.endDate;
        let sourceSheetName = "";
        let sourceType = "template";
        let status = "draft";
        const hasDraft = titles.has(draftName);
        const hasClosed = titles.has(closedName);
        if (hasDraft) {
          sourceSheetName = draftName;
          sourceType = "period";
          status = "draft";
        } else if (hasClosed) {
          sourceSheetName = closedName;
          sourceType = "period";
          status = "closed";
        } else if (titles.has(legacyName)) {
          sourceSheetName = legacyName;
          sourceType = "legacy";
          status = "draft";
        }

        const values = sourceSheetName
          ? await getSheetValuesByTitle(sourceSheetName)
          : buildDefaultManualSheetValues();
        const parsed = parseManualSheetValues(values);
        return {
          sheetName: sourceSheetName || buildManualPeriodLabel(period.startDate, period.endDate),
          displayName: sourceSheetName || buildManualPeriodSheetName(period.startDate, period.endDate, status),
          sourceSheetName: sourceSheetName || "",
          created: false,
          virtual: !sourceSheetName,
          sourceType,
          periodStart: period.startDate,
          periodEnd: period.endDate,
          status,
          hasDraft,
          hasClosed,
          analyticsMirrorSheetName: titles.has(legacyName) ? legacyName : "",
          moneyTitle: parsed.moneyTitle,
          moneyHeaders: parsed.moneyHeaders,
          moneyRows: parsed.moneyRows,
          transferTitle: parsed.transferTitle,
          transferHeaders: parsed.transferHeaders,
          transferRows: parsed.transferRows,
          writeEnabled: true,
          spreadsheetUrl: state.config?.manualFinance?.spreadsheetUrl || ""
        };
      }

      async function getSheetValuesByTitle(sheetTitle, spreadsheetId = getManualFinanceSpreadsheetId()) {
        const range = encodeURIComponent(`'${sheetTitle.replace(/'/g, "''")}'`);
        const payload = await googleSheetsFetch(`/spreadsheets/${spreadsheetId}/values/${range}`);
        return payload.values || [];
      }

      async function saveManualSheetDirect(params) {
        const period = normalizePeriod(params.startDate, params.endDate);
        const status = params.status === "closed" ? "closed" : "draft";
        const activeSheetName = buildManualPeriodSheetName(period.startDate, period.endDate, status);
        const oppositeStatus = status === "closed" ? "draft" : "closed";
        const oppositeSheetName = buildManualPeriodSheetName(period.startDate, period.endDate, oppositeStatus);
        const rawMoneyRows = Array.isArray(params.moneyRows) ? params.moneyRows : [];
        const moneyRows = normalizeManualFinanceMoneyRows(
          rawMoneyRows.map((row, rowIndex) => ({
            channel: row.channel,
            now: normalizeManualFinancePersistedNumberInput(row.now, { rows: rawMoneyRows, rowIndex, key: "now" }),
            serviceIncome: normalizeManualFinancePersistedNumberInput(row.serviceIncome, { rows: rawMoneyRows, rowIndex, key: "serviceIncome" }),
            business: normalizeManualFinancePersistedNumberInput(row.business, { rows: rawMoneyRows, rowIndex, key: "business" }),
            food: normalizeManualFinancePersistedNumberInput(row.food, { rows: rawMoneyRows, rowIndex, key: "food" }),
            house: normalizeManualFinancePersistedNumberInput(row.house, { rows: rawMoneyRows, rowIndex, key: "house" }),
            study: normalizeManualFinancePersistedNumberInput(row.study, { rows: rawMoneyRows, rowIndex, key: "study" }),
            travelFun: normalizeManualFinancePersistedNumberInput(row.travelFun, { rows: rawMoneyRows, rowIndex, key: "travelFun" })
          }))
        );
        const transferRows = normalizeManualFinanceTransferRows(
          (params.transferRows || []).map((row) => ({
            date: String(row.date || "").trim(),
            amount: normalizeManualFinancePersistedNumberInput(row.amount),
            localCurrency: String(row.localCurrency || "").trim(),
            rate: normalizeManualFinancePersistedNumberInput(row.rate),
            usdAmount: normalizeManualFinancePersistedNumberInput(row.usdAmount),
            destination: String(row.destination || "").trim()
          })),
          { padToMinimum: false }
        );
        const sheetValues = buildManualSheetValuesFromState(moneyRows, transferRows);
        await ensureSheetExists(activeSheetName, getManualFinanceSpreadsheetId());
        await overwriteSheetValues(activeSheetName, sheetValues, getManualFinanceSpreadsheetId());
        await deleteSheetIfExists(oppositeSheetName, getManualFinanceSpreadsheetId());
        if (status === "closed") {
          await ensureSheetExists(period.endDate, getManualFinanceSpreadsheetId());
          await overwriteSheetValues(period.endDate, sheetValues, getManualFinanceSpreadsheetId());
        }
        return {
          periodStart: period.startDate,
          periodEnd: period.endDate,
          status,
          sourceSheetName: activeSheetName,
          analyticsMirrorSheetName: status === "closed" ? period.endDate : "",
          savedAt: new Date().toLocaleString("ru-RU"),
          writeEnabled: true
        };
      }

      function normalizePeriod(startDate, endDate) {
        if (!MANUAL_DATE_RE.test(String(startDate || "")) || !MANUAL_DATE_RE.test(String(endDate || ""))) {
          throw new Error("startDate and endDate must be in YYYY-MM-DD format.");
        }
        if (startDate > endDate) throw new Error("startDate cannot be later than endDate.");
        return { startDate, endDate };
      }

      function buildManualPeriodSheetName(startDate, endDate, status) {
        return `PERIOD__${startDate}__${endDate}__${status}`;
      }

      function buildManualPeriodLabel(startDate, endDate) {
        return startDate === endDate ? formatDisplayDate(endDate) : `${formatDisplayDate(startDate)} - ${formatDisplayDate(endDate)}`;
      }

      async function ensureSheetExists(title, spreadsheetId = getManualFinanceSpreadsheetId()) {
        const metadata = await getSpreadsheetMetadata(spreadsheetId);
        const existing = (metadata.sheets || []).find((sheet) => sheet?.properties?.title === title);
        if (existing) return existing.properties.sheetId;
        const payload = await googleSheetsFetch(`/spreadsheets/${spreadsheetId}:batchUpdate`, {
          method: "POST",
          body: JSON.stringify({
            requests: [{ addSheet: { properties: { title } } }]
          })
        });
        return payload.replies?.[0]?.addSheet?.properties?.sheetId || null;
      }

      async function deleteSheetIfExists(title, spreadsheetId = getManualFinanceSpreadsheetId()) {
        const metadata = await getSpreadsheetMetadata(spreadsheetId);
        const existing = (metadata.sheets || []).find((sheet) => sheet?.properties?.title === title);
        if (!existing) return false;
        await googleSheetsFetch(`/spreadsheets/${spreadsheetId}:batchUpdate`, {
          method: "POST",
          body: JSON.stringify({
            requests: [{ deleteSheet: { sheetId: existing.properties.sheetId } }]
          })
        });
        return true;
      }

      async function overwriteSheetValues(sheetTitle, values, spreadsheetId = getManualFinanceSpreadsheetId()) {
        const baseRange = encodeURIComponent(`'${sheetTitle.replace(/'/g, "''")}'!A:Z`);
        await googleSheetsFetch(`/spreadsheets/${spreadsheetId}/values/${baseRange}:clear`, {
          method: "POST",
          body: "{}"
        });
        const endColumn = columnLetter(Math.max(...values.map((row) => row.length), 8));
        const endRow = values.length;
        const updateRange = encodeURIComponent(`'${sheetTitle.replace(/'/g, "''")}'!A1:${endColumn}${endRow}`);
        await googleSheetsFetch(`/spreadsheets/${spreadsheetId}/values/${updateRange}?valueInputOption=USER_ENTERED`, {
          method: "PUT",
          body: JSON.stringify({
            range: `'${sheetTitle}'!A1:${endColumn}${endRow}`,
            majorDimension: "ROWS",
            values
          })
        });
      }

      function buildDefaultManualSheetValues() {
        return buildManualSheetValuesFromState(
          normalizeManualFinanceMoneyRows(),
          normalizeManualFinanceTransferRows([], { padToMinimum: false })
        );
      }

      function buildManualSheetValuesFromState(moneyRows, transferRows) {
        const body = [];
        body.push([MANUAL_FINANCE_MONEY_TITLE, "", "", "", "", "", "", "", "", ""]);
        body.push(MANUAL_FINANCE_HEADERS.slice());
        const baseRows = moneyRows.slice(0, MANUAL_FINANCE_MONEY_CHANNELS.length);
        baseRows.forEach((row) => {
          body.push([
            row.channel || "",
            row.now || "",
            row.serviceIncome || "",
            row.business || "",
            row.house || "",
            row.food || "",
            row.study || "",
            row.travelFun || "",
            row.total || "",
            row.exchange || ""
          ]);
        });
        const summary = moneyRows[MANUAL_FINANCE_MONEY_CHANNELS.length] || {
          channel: MANUAL_FINANCE_TOTAL_LABEL,
          now: "",
          serviceIncome: "",
          business: "",
          food: "",
          house: "",
          study: "",
          travelFun: "",
          total: "",
          exchange: ""
        };
        body.push([
          summary.channel || MANUAL_FINANCE_TOTAL_LABEL,
          summary.now || "",
          summary.serviceIncome || "",
          summary.business || "",
          summary.house || "",
          summary.food || "",
          summary.study || "",
          summary.travelFun || "",
          summary.total || "",
          summary.exchange || ""
        ]);
        body.push(["", "", "", "", "", "", "", "", "", ""]);
        body.push([MANUAL_FINANCE_TRANSFER_TITLE, "", "", "", "", "", "", "", "", ""]);
        body.push([...MANUAL_TRANSFER_HEADERS, "", "", ""]);
        transferRows.forEach((row) => {
          body.push([
            row.date || "",
            row.amount || "",
            row.localCurrency || "",
            row.rate || "",
            row.usdAmount || "",
            row.destination || "",
            "",
            "",
            ""
          ]);
        });
        return body;
      }

      function parseManualSheetValues(values) {
        const rows = values || [];
        const moneyTitle = rows[0]?.[0] || MANUAL_FINANCE_MONEY_TITLE;
        const moneyHeaders = rows[1]?.length ? rows[1].slice(0, MANUAL_FINANCE_HEADERS.length) : MANUAL_FINANCE_HEADERS.slice();
        const hasServiceIncomeColumn = /(service|приход)/i.test(String(moneyHeaders[2] || "").trim());
        const moneyRows = [];
        let index = 2;
        while (index < rows.length) {
          const row = rows[index] || [];
          const label = String(row[0] || "").trim();
          if (!label) {
            index += 1;
            continue;
          }
          if (label === MANUAL_FINANCE_TRANSFER_TITLE) break;
          if (label === MANUAL_FINANCE_TOTAL_LABEL) {
            moneyRows.push({
              channel: label,
              now: row[1] || "",
              serviceIncome: hasServiceIncomeColumn ? (row[2] || "") : "",
              business: hasServiceIncomeColumn ? (row[3] || "") : (row[2] || ""),
              house: hasServiceIncomeColumn ? (row[4] || "") : (row[4] || ""),
              food: hasServiceIncomeColumn ? (row[5] || "") : (row[3] || ""),
              study: hasServiceIncomeColumn ? (row[6] || "") : (row[5] || ""),
              travelFun: hasServiceIncomeColumn ? (row[7] || "") : (row[6] || ""),
              total: hasServiceIncomeColumn ? (row[8] || "") : (row[7] || ""),
              exchange: hasServiceIncomeColumn ? (row[9] || "") : (row[8] || "")
            });
            index += 1;
            break;
          }
          moneyRows.push({
            channel: label,
            now: row[1] || "",
            serviceIncome: hasServiceIncomeColumn ? (row[2] || "") : "",
            business: hasServiceIncomeColumn ? (row[3] || "") : (row[2] || ""),
            house: hasServiceIncomeColumn ? (row[4] || "") : (row[4] || ""),
            food: hasServiceIncomeColumn ? (row[5] || "") : (row[3] || ""),
            study: hasServiceIncomeColumn ? (row[6] || "") : (row[5] || ""),
            travelFun: hasServiceIncomeColumn ? (row[7] || "") : (row[6] || ""),
            total: hasServiceIncomeColumn ? (row[8] || "") : (row[7] || ""),
            exchange: hasServiceIncomeColumn ? (row[9] || "") : (row[8] || "")
          });
          index += 1;
        }
        while (moneyRows.length < MANUAL_FINANCE_MONEY_CHANNELS.length + 1) {
          if (moneyRows.length < MANUAL_FINANCE_MONEY_CHANNELS.length) {
            moneyRows.push({
              channel: MANUAL_FINANCE_MONEY_CHANNELS[moneyRows.length],
              now: "", serviceIncome: "", business: "", food: "", house: "", study: "", travelFun: "", total: "", exchange: ""
            });
          } else {
            moneyRows.push({
              channel: MANUAL_FINANCE_TOTAL_LABEL,
              now: "", serviceIncome: "", business: "", food: "", house: "", study: "", travelFun: "", total: "", exchange: ""
            });
          }
        }
        while (index < rows.length && String(rows[index]?.[0] || "").trim() !== MANUAL_FINANCE_TRANSFER_TITLE) index += 1;
        const transferHeaders = rows[index + 1]?.length ? rows[index + 1].slice(0, MANUAL_TRANSFER_HEADERS.length) : MANUAL_TRANSFER_HEADERS.slice();
        const transferRows = [];
        for (let cursor = index + 2; cursor < rows.length; cursor += 1) {
          const row = rows[cursor] || [];
          if (!row.some((cell) => String(cell || "").trim())) continue;
          transferRows.push({
            date: row[0] || "",
            amount: row[1] || "",
            localCurrency: row[2] || "",
            rate: row[3] || "",
            usdAmount: row[4] || "",
            destination: row[5] || ""
          });
        }
        return {
          moneyTitle,
          moneyHeaders,
          moneyRows: normalizeManualFinanceMoneyRows(moneyRows),
          transferTitle: MANUAL_FINANCE_TRANSFER_TITLE,
          transferHeaders,
          transferRows: normalizeManualFinanceTransferRows(transferRows)
        };
      }

      function columnLetter(number) {
        let temp = "";
        let n = number;
        while (n > 0) {
          const rem = (n - 1) % 26;
          temp = String.fromCharCode(65 + rem) + temp;
          n = Math.floor((n - rem) / 26);
        }
        return temp || "A";
      }

      function normalizeManualFinanceNumberInput(value) {
        const raw = String(value ?? "").trim();
        if (!raw) return "";
        if (isManualFinanceFormula(raw)) return raw;
        const parsed = parseLooseNumber(raw);
        return Number.isFinite(parsed) ? String(roundTo2(parsed)) : "";
      }

      function getManualTransfersSheetName() {
        return String(state.config?.manualFinance?.transfersSheetName || MANUAL_FINANCE_TRANSFER_TITLE).trim() || MANUAL_FINANCE_TRANSFER_TITLE;
      }

      function getManualExpensesSheetName() {
        return String(state.config?.manualFinance?.expensesSheetName || MANUAL_FINANCE_EXPENSE_TITLE).trim() || MANUAL_FINANCE_EXPENSE_TITLE;
      }

      function assertIncomingTransferHeaders(values) {
        const rows = values || [];
        if (!rows.length || !rows[0]?.some((cell) => String(cell || "").trim())) return;
        const actual = MANUAL_TRANSFER_HEADERS.map((_, index) => String(rows[0]?.[index] || "").trim());
        const expected = MANUAL_TRANSFER_HEADERS.slice();
        if (JSON.stringify(actual) !== JSON.stringify(expected)) {
          throw new Error(`Transfer sheet header mismatch. Expected ${expected.join(" | ")}, got ${actual.join(" | ")}`);
        }
      }

      function assertIncomingExpenseHeaders(values) {
        const rows = values || [];
        if (!rows.length || !rows[0]?.some((cell) => String(cell || "").trim())) return;
        const expected = ["дата", "категория", ...getManualFinanceChannels()];
        const actual = expected.map((_, index) => String(rows[0]?.[index] || "").trim());
        if (JSON.stringify(actual) !== JSON.stringify(expected)) {
          throw new Error(`Expense sheet header mismatch. Expected ${expected.join(" | ")}, got ${actual.join(" | ")}`);
        }
      }

      function parseIncomingTransferSheetValues(values) {
        const rows = values || [];
        assertIncomingTransferHeaders(rows);
        const transferRows = [];
        for (let index = 1; index < rows.length; index += 1) {
          const row = rows[index] || [];
          if (!row.some((cell) => String(cell || "").trim())) continue;
          const transferDate = normalizeIncomingSheetDateValue(row[0]);
          const amount = row[2] || "";
          const currency = row[3] || "";
          const channel = row[4] || "";
          const rate = row[5] || "";
          const usdAmount = row[6] || "";
          const hasMeaningfulTransferData = Boolean(
            transferDate &&
            (
              String(amount || "").trim() ||
              String(currency || "").trim() ||
              String(channel || "").trim() ||
              String(rate || "").trim() ||
              String(usdAmount || "").trim()
            )
          );
          if (!hasMeaningfulTransferData) continue;
          transferRows.push({
            transferDate,
            who: row[1] || "",
            amount,
            currency,
            channel,
            rate,
            usdAmount
          });
        }
        return transferRows;
      }

      function parseIncomingExpenseSheetValues(values) {
        const rows = values || [];
        assertIncomingExpenseHeaders(rows);
        const expenseRows = [];
        const channels = getManualFinanceChannels();
        for (let index = 1; index < rows.length; index += 1) {
          const row = rows[index] || [];
          if (!row.some((cell) => String(cell || "").trim())) continue;
          const amounts = {};
          channels.forEach((channel, channelIndex) => {
            amounts[channel] = normalizeManualFinancePersistedNumberInput(row[channelIndex + 2] || "");
          });
          const normalizedDate = normalizeIncomingSheetDateValue(row[0]);
          const category = String(row[1] || "").trim();
          if (!normalizedDate || !category) continue;
          expenseRows.push({
            date: normalizedDate,
            category,
            amounts
          });
        }
        return expenseRows;
      }

      function normalizeIncomingSheetDateValue(value) {
        const raw = String(value ?? "").trim();
        if (!raw) return "";
        const parsed = parseDisplayDate(raw);
        return parsed ? parseDisplayDateToIso(raw) : "";
      }

      function buildIncomingTransferSheetValues(rows) {
        return [
          MANUAL_TRANSFER_HEADERS.slice(),
          ...rows.map((row) => [
            row.transferDate || "",
            row.who || "",
            row.amount || "",
            row.currency || "",
            row.channel || "",
            row.rate || "",
            row.usdAmount || ""
          ])
        ];
      }

      function buildIncomingExpenseSheetValues(rows) {
        const channels = getManualFinanceChannels();
        return [
          ["дата", "категория", ...channels],
          ...rows.map((row) => [
            row.date || "",
            row.category || "",
            ...channels.map((channel) => row.amounts?.[channel] || "")
          ])
        ];
      }

      function replaceManualRowsForDateRange(existingRows, replacementRows, startDate, endDate, dateKey) {
        const preserved = (existingRows || []).filter((row) => {
          const rowDate = normalizeIncomingSheetDateValue(row?.[dateKey] || "");
          return !rowDate || rowDate < startDate || rowDate > endDate;
        });
        const merged = [...preserved, ...(replacementRows || [])];
        return merged.sort((a, b) => {
          const left = normalizeIncomingSheetDateValue(a?.[dateKey] || "");
          const right = normalizeIncomingSheetDateValue(b?.[dateKey] || "");
          if (left !== right) return left.localeCompare(right);
          return JSON.stringify(a).localeCompare(JSON.stringify(b));
        });
      }

      async function listManualSheetDatesDirect() {
        const metadata = await getManualSpreadsheetMetadata();
        const titles = new Set((metadata.sheets || []).map((sheet) => sheet?.properties?.title || ""));
        const transferValues = titles.has(getManualTransfersSheetName())
          ? await getSheetValuesByTitle(getManualTransfersSheetName())
          : [];
        const expenseValues = titles.has(getManualExpensesSheetName())
          ? await getSheetValuesByTitle(getManualExpensesSheetName())
          : [];
        const dates = new Set();
        parseIncomingTransferSheetValues(transferValues).forEach((row) => row.transferDate && dates.add(row.transferDate));
        parseIncomingExpenseSheetValues(expenseValues).forEach((row) => row.date && dates.add(row.date));
        return {
          dates: [...dates].sort().reverse(),
          spreadsheetUrl: state.config?.manualFinance?.spreadsheetUrl || "",
          title: state.config?.manualFinance?.title || "EzoHata Manual Inputs",
          writeEnabled: true
        };
      }

      async function getManualSheetDirect(startDate, endDate) {
        const period = normalizePeriod(startDate, endDate);
        const snapshotDate = period.endDate;
        const metadata = await getManualSpreadsheetMetadata();
        const titles = new Set((metadata.sheets || []).map((sheet) => sheet?.properties?.title || ""));
        const transferValues = titles.has(getManualTransfersSheetName())
          ? await getSheetValuesByTitle(getManualTransfersSheetName())
          : buildIncomingTransferSheetValues([]);
        const expenseValues = titles.has(getManualExpensesSheetName())
          ? await getSheetValuesByTitle(getManualExpensesSheetName())
          : buildIncomingExpenseSheetValues([]);
        const transferRows = parseIncomingTransferSheetValues(transferValues).filter((row) => {
          return row.transferDate && row.transferDate === snapshotDate;
        });
        const expenseRows = parseIncomingExpenseSheetValues(expenseValues).filter((row) => {
          return row.date && row.date === snapshotDate;
        });
        return {
          sheetName: MANUAL_INCOMING_TITLE,
          displayName: `${MANUAL_INCOMING_TITLE}: ${snapshotDate}`,
          sourceSheetName: `${getManualTransfersSheetName()} + ${getManualExpensesSheetName()}`,
          created: false,
          virtual: false,
          sourceType: "incoming-repository",
          periodStart: snapshotDate,
          periodEnd: snapshotDate,
          status: "saved",
          moneyTitle: MANUAL_FINANCE_MONEY_TITLE,
          moneyHeaders: MANUAL_FINANCE_HEADERS,
          moneyRows: buildLegacyFactMoneyRowsFromExpenseRows(
            expenseRows.length
              ? normalizeManualFinanceExpenseRows(expenseRows, snapshotDate, snapshotDate)
              : []
          ),
          transferTitle: getManualTransfersSheetName(),
          transferHeaders: MANUAL_TRANSFER_HEADERS,
          transferRows,
          emptyFact: !expenseRows.length,
          expenseTitle: getManualExpensesSheetName(),
          expenseHeaders: buildManualExpenseHeaders(),
          expenseRows,
          writeEnabled: true,
          spreadsheetUrl: state.config?.manualFinance?.spreadsheetUrl || ""
        };
      }

      async function getManualTransfersSheetDirect(startDate, endDate) {
        const period = normalizePeriod(startDate, endDate);
        const metadata = await getManualSpreadsheetMetadata();
        const titles = new Set((metadata.sheets || []).map((sheet) => sheet?.properties?.title || ""));
        const transferValues = titles.has(getManualTransfersSheetName())
          ? await getSheetValuesByTitle(getManualTransfersSheetName())
          : buildIncomingTransferSheetValues([]);
        const transferRows = parseIncomingTransferSheetValues(transferValues)
          .filter((row) => row.transferDate && row.transferDate >= period.startDate && row.transferDate <= period.endDate);
        return {
          sheetName: getManualTransfersSheetName(),
          sourceSheetName: getManualTransfersSheetName(),
          periodStart: period.startDate,
          periodEnd: period.endDate,
          status: "saved",
          transferTitle: getManualTransfersSheetName(),
          transferHeaders: MANUAL_TRANSFER_HEADERS,
          transferRows: normalizeManualFinanceTransferRows(transferRows),
          writeEnabled: true,
          spreadsheetUrl: state.config?.manualFinance?.spreadsheetUrl || ""
        };
      }

      async function saveManualTransfersSheetDirect(startDate, endDate, rawTransferRows) {
        const period = normalizePeriod(startDate, endDate);
        const metadata = await getManualSpreadsheetMetadata();
        const titles = new Set((metadata.sheets || []).map((sheet) => sheet?.properties?.title || ""));
        const existingTransfers = titles.has(getManualTransfersSheetName())
          ? parseIncomingTransferSheetValues(await getSheetValuesByTitle(getManualTransfersSheetName()))
          : [];
        const transferRows = normalizeManualFinanceTransferRows(rawTransferRows, { padToMinimum: false })
          .filter((row) => Object.values(row).some((value) => String(value || "").trim()))
          .map((row) => ({
            transferDate: normalizeIncomingSheetDateValue(row.transferDate) || period.endDate,
            who: String(row.who || "").trim(),
            amount: normalizeManualFinancePersistedNumberInput(row.amount),
            currency: String(row.currency || "").trim(),
            channel: String(row.channel || "").trim(),
            rate: normalizeManualFinancePersistedNumberInput(row.rate),
            usdAmount: normalizeManualFinancePersistedNumberInput(row.usdAmount)
          }));
        const mergedTransfers = replaceManualRowsForDateRange(
          existingTransfers,
          transferRows,
          period.startDate,
          period.endDate,
          "transferDate"
        );
        await ensureSheetExists(getManualTransfersSheetName(), getManualFinanceSpreadsheetId());
        await overwriteSheetValues(getManualTransfersSheetName(), buildIncomingTransferSheetValues(mergedTransfers), getManualFinanceSpreadsheetId());
        return {
          periodStart: period.startDate,
          periodEnd: period.endDate,
          sourceSheetName: getManualTransfersSheetName(),
          savedAt: new Date().toLocaleString("ru-RU"),
          writeEnabled: true
        };
      }

      async function saveManualSheetDirect(params) {
        const period = normalizePeriod(params.startDate, params.endDate);
        const snapshotDate = period.endDate;
        const metadata = await getManualSpreadsheetMetadata();
        const titles = new Set((metadata.sheets || []).map((sheet) => sheet?.properties?.title || ""));
        const existingTransfers = titles.has(getManualTransfersSheetName())
          ? parseIncomingTransferSheetValues(await getSheetValuesByTitle(getManualTransfersSheetName()))
          : [];
        const existingExpenses = titles.has(getManualExpensesSheetName())
          ? parseIncomingExpenseSheetValues(await getSheetValuesByTitle(getManualExpensesSheetName()))
          : [];
        const transferRows = normalizeManualFinanceTransferRows(params.transferRows, { padToMinimum: false })
          .filter((row) => Object.values(row).some((value) => String(value || "").trim()))
          .map((row) => ({
            transferDate: snapshotDate,
            who: String(row.who || "").trim(),
            amount: normalizeManualFinancePersistedNumberInput(row.amount),
            currency: String(row.currency || "").trim(),
            channel: String(row.channel || "").trim(),
            rate: normalizeManualFinancePersistedNumberInput(row.rate),
            usdAmount: normalizeManualFinancePersistedNumberInput(row.usdAmount)
          }));
        const isLegacyFactSnapshotSave = Array.isArray(params.moneyRows) && params.moneyRows.length;
        const expenseRows = isLegacyFactSnapshotSave
          ? convertLegacyFactMoneyRowsToExpenseRows(params.moneyRows, snapshotDate)
          : normalizeManualFinanceExpenseRows(params.expenseRows, snapshotDate, snapshotDate)
              .map((row) => ({
                date: snapshotDate,
                category: row.category,
                amounts: Object.fromEntries(
                  getManualFinanceChannels().map((channel) => [channel, normalizeManualFinancePersistedNumberInput(row.amounts?.[channel])])
                )
              }));
        const expenseReplaceStart = snapshotDate;
        const expenseReplaceEnd = snapshotDate;
        const mergedTransfers = replaceManualRowsForDateRange(existingTransfers, transferRows, snapshotDate, snapshotDate, "transferDate");
        const mergedExpenses = replaceManualRowsForDateRange(existingExpenses, expenseRows, expenseReplaceStart, expenseReplaceEnd, "date");
        await ensureSheetExists(getManualTransfersSheetName(), getManualFinanceSpreadsheetId());
        await ensureSheetExists(getManualExpensesSheetName(), getManualFinanceSpreadsheetId());
        await overwriteSheetValues(getManualTransfersSheetName(), buildIncomingTransferSheetValues(mergedTransfers), getManualFinanceSpreadsheetId());
        await overwriteSheetValues(getManualExpensesSheetName(), buildIncomingExpenseSheetValues(mergedExpenses), getManualFinanceSpreadsheetId());
        return {
          periodStart: snapshotDate,
          periodEnd: snapshotDate,
          status: "saved",
          sourceSheetName: `${getManualTransfersSheetName()} + ${getManualExpensesSheetName()}`,
          savedAt: new Date().toLocaleString("ru-RU"),
          writeEnabled: true
        };
      }

      function persistLocalDraft(startDate, endDate, data) {
        localStorage.setItem(getDraftKey(startDate, endDate), JSON.stringify(data));
        const list = listLocalDrafts().filter((item) => item.startDate !== startDate || item.endDate !== endDate);
        list.unshift({ startDate, endDate, status: data.status || "draft" });
        localStorage.setItem("ezohata-v2-local-drafts", JSON.stringify(list.slice(0, 30)));
      }

      function getLocalDraft(startDate, endDate) {
        try { return JSON.parse(localStorage.getItem(getDraftKey(startDate, endDate)) || "null"); }
        catch { return null; }
      }

      function listLocalDrafts() {
        try { return JSON.parse(localStorage.getItem("ezohata-v2-local-drafts") || "[]"); }
        catch { return []; }
      }

      function getDraftKey(startDate, endDate) {
        return `ezohata:incoming-ledger:${startDate}:${endDate}`;
      }

      function setManualFinanceStatus(message, isError = false) {
        state.manualFinance.status = message;
        state.manualFinance.error = Boolean(isError);
      }

      function getManualFinanceUnavailableMessage() {
        if (!state.googleAuth.configured) {
          return "Google OAuth client is not configured in sheet-config.json yet.";
        }
        if (!state.googleAuth.accessToken) {
          return "Google OAuth обязателен. Подключите Google, чтобы открыть fact и пересчитать аналитику.";
        }
        return "Manual workbook is not available right now.";
      }

      async function loadManualOrdersSheet(interactive = false) {
        state.manualOrders.loading = true;
        renderTabs();
        try {
          if (!hasConfiguredManualOrdersEndpoint()) {
            if (interactive && getManualOrdersConfig().spreadsheetId) {
              await ensureGoogleAccess(true);
            }
          }
          if (!hasConfiguredManualOrdersEndpoint()) {
            throw new Error(getManualOrdersUnavailableMessage());
          }
          const payload = await getManualOrdersSheetDirect();
          state.manualOrders.data = buildManualOrdersStateFromPayload(payload);
          state.manualOrders.dirty = false;
          setManualOrdersStatus("Orders открыты из manual workbook.", false);
          applyManualOrdersToDashboard(elements.startDate.value, elements.endDate.value);
        } catch (error) {
          openLocalManualOrders(error.message || getManualOrdersUnavailableMessage(), Boolean(state.googleAuth.accessToken));
          applyManualOrdersToDashboard(elements.startDate.value, elements.endDate.value);
        } finally {
          state.manualOrders.loading = false;
          renderTabs();
        }
      }

      function openLocalManualOrders(statusMessage, isError = true) {
        const saved = getLocalOrdersDraft();
        const config = getManualOrdersConfig();
        state.manualOrders.data = buildManualOrdersStateFromPayload({
          sheetName: config.sheetName,
          sourceSheetName: "",
          sourceType: "local",
          virtual: true,
          writeEnabled: false,
          headers: saved?.headers || MANUAL_ORDERS_HEADERS,
          rows: saved?.rows || buildDefaultManualOrdersRows(),
          spreadsheetUrl: config.spreadsheetUrl
        });
        state.manualOrders.dirty = false;
        setManualOrdersStatus(statusMessage, isError);
      }

      async function getManualOrdersSheetDirect() {
        const config = getManualOrdersConfig();
        const metadata = await getSpreadsheetMetadata(config.spreadsheetId);
        const titles = new Set((metadata.sheets || []).map((sheet) => sheet?.properties?.title || ""));
        const sourceSheetName = titles.has(config.sheetName)
          ? config.sheetName
          : (titles.has(MANUAL_ORDERS_LEGACY_SHEET_NAME) ? MANUAL_ORDERS_LEGACY_SHEET_NAME : "");
        const values = sourceSheetName
          ? await getSheetValuesByTitle(sourceSheetName, config.spreadsheetId)
          : buildManualOrdersValuesFromState(MANUAL_ORDERS_HEADERS, buildDefaultManualOrdersRows());
        const parsed = parseManualOrdersValues(values);
        return {
          sheetName: config.sheetName,
          sourceSheetName,
          sourceType: sourceSheetName ? "sheet" : "template",
          virtual: !sourceSheetName,
          writeEnabled: true,
          headers: parsed.headers,
          rows: parsed.rows,
          spreadsheetUrl: config.spreadsheetUrl
        };
      }

      async function saveManualOrdersSheet() {
        if (!state.manualOrders.data) return;
        if (!hasConfiguredManualOrdersEndpoint()) {
          if (getManualOrdersConfig().spreadsheetId) {
            try {
              await ensureGoogleAccess(true);
            } catch (error) {
              setManualOrdersStatus(error.message || "Не удалось подключить Google для orders.", true);
              renderTabs();
              return;
            }
          }
        }
        if (!hasConfiguredManualOrdersEndpoint()) {
          persistLocalOrdersDraft(state.manualOrders.data);
          state.manualOrders.dirty = false;
          setManualOrdersStatus("Локальный orders draft сохранён в браузере.", false);
          renderTabs();
          return;
        }
        state.manualOrders.loading = true;
        renderTabs();
        try {
          const response = await saveManualOrdersSheetDirect({
            headers: state.manualOrders.data.headers,
            rows: state.manualOrders.data.rows
          });
          await loadManualOrdersSheet(false);
          setManualOrdersStatus(`Orders сохранены в manual workbook. ${response?.savedAt || ""}`.trim(), false);
          await loadDashboardData();
        } catch (error) {
          setManualOrdersStatus(error.message || "Не удалось сохранить orders.", true);
        } finally {
          state.manualOrders.loading = false;
          renderTabs();
        }
      }

      async function saveManualOrdersSheetDirect(params) {
        const config = getManualOrdersConfig();
        const headers = normalizeManualOrdersHeaders(params.headers);
        const rows = normalizeManualOrdersRows(params.rows);
        const values = buildManualOrdersValuesFromState(headers, rows);
        await ensureSheetExists(config.sheetName, config.spreadsheetId);
        await overwriteSheetValues(config.sheetName, values, config.spreadsheetId);
        return {
          sheetName: config.sheetName,
          savedAt: new Date().toLocaleString("ru-RU"),
          writeEnabled: true
        };
      }

      function buildManualOrdersStateFromPayload(data) {
        return {
          sheetName: data.sheetName || getManualOrdersConfig().sheetName,
          sourceSheetName: data.sourceSheetName || "",
          sourceType: data.sourceType || "local",
          virtual: Boolean(data.virtual),
          writeEnabled: Boolean(data.writeEnabled),
          headers: normalizeManualOrdersHeaders(data.headers),
          rows: normalizeManualOrdersRows(data.rows),
          spreadsheetUrl: data.spreadsheetUrl || getManualOrdersConfig().spreadsheetUrl
        };
      }

      function buildDefaultManualOrdersRows() {
        return Array.from({ length: MANUAL_ORDERS_DEFAULT_ROWS }, () => Array.from({ length: MANUAL_ORDERS_HEADERS.length }, () => ""));
      }

      function normalizeManualOrdersHeaders(headers) {
        const mapped = ORDERS_HELPER.mapLegacyOrdersValues
          ? ORDERS_HELPER.mapLegacyOrdersValues([Array.isArray(headers) ? headers : MANUAL_ORDERS_HEADERS]).headers
          : MANUAL_ORDERS_HEADERS;
        return padRowToWidth((mapped || MANUAL_ORDERS_HEADERS).map((cell) => String(cell || "")), MANUAL_ORDERS_HEADERS.length).slice(0, MANUAL_ORDERS_HEADERS.length);
      }

      function normalizeManualOrdersRows(rows) {
        const normalized = (Array.isArray(rows) ? rows : [])
          .map((row) => padRowToWidth((Array.isArray(row) ? row : []).map((cell) => String(cell || "")), MANUAL_ORDERS_HEADERS.length).slice(0, MANUAL_ORDERS_HEADERS.length))
          .filter((row) => row.some((cell) => String(cell || "").trim()));
        return normalized.length ? normalized : buildDefaultManualOrdersRows();
      }

      function buildManualOrdersValuesFromState(headers, rows) {
        return [normalizeManualOrdersHeaders(headers), ...normalizeManualOrdersRows(rows)];
      }

      function parseManualOrdersValues(values) {
        if (!Array.isArray(values) || !values.length) {
          return { headers: MANUAL_ORDERS_HEADERS.slice(), rows: buildDefaultManualOrdersRows() };
        }
        const mapped = ORDERS_HELPER.mapLegacyOrdersValues
          ? ORDERS_HELPER.mapLegacyOrdersValues(values)
          : { headers: values[0], rows: values.slice(1) };
        return {
          headers: normalizeManualOrdersHeaders(mapped.headers),
          rows: normalizeManualOrdersRows(mapped.rows)
        };
      }

      function updateManualOrderValue(rowIndex, cellIndex, rawValue) {
        const row = state.manualOrders.data?.rows?.[rowIndex];
        if (!row) return;
        row[cellIndex] = rawValue;
        state.manualOrders.dirty = true;
      }

      function addManualOrderRow() {
        if (!state.manualOrders.data) return;
        state.manualOrders.data.rows.push(Array.from({ length: MANUAL_ORDERS_HEADERS.length }, () => ""));
        state.manualOrders.dirty = true;
        renderTabs();
      }

      function removeManualOrderRow(rowIndex) {
        if (!state.manualOrders.data) return;
        state.manualOrders.data.rows.splice(rowIndex, 1);
        if (!state.manualOrders.data.rows.length) {
          state.manualOrders.data.rows = buildDefaultManualOrdersRows();
        }
        state.manualOrders.dirty = true;
        renderTabs();
      }

      function appendManualOrdersFromText() {
        if (!state.manualOrders.data) {
          setManualOrdersStatus("Сначала откройте orders.", true);
          renderTabs();
          return;
        }
        const rawText = String(state.manualOrders.textDraft || "").trim();
        if (!rawText) {
          setManualOrdersStatus("Вставьте текст заказа перед разбором.", true);
          renderTabs();
          return;
        }
        const parser = ORDERS_HELPER.parseManualOrdersTextBlocks;
        const defaultDate = elements.endDate.value || elements.startDate.value || "";
        const rows = typeof parser === "function" ? parser(rawText, defaultDate) : [];
        if (!rows.length) {
          setManualOrdersStatus("Не удалось разобрать текст заказа.", true);
          renderTabs();
          return;
        }
        state.manualOrders.data.rows = rows.map((row) => row.slice());
        state.manualOrders.textDraft = "";
        state.manualOrders.dirty = true;
        setManualOrdersStatus(`Текст разобран в ${rows.length} строк(и). Таблица заказов пересобрана из текущего текста.`, false);
        applyManualOrdersToDashboard(elements.startDate.value, elements.endDate.value);
        renderTabs();
      }

      function persistLocalOrdersDraft(data) {
        localStorage.setItem("ezohata:v2:orders", JSON.stringify({
          headers: data.headers,
          rows: data.rows
        }));
      }

      function getLocalOrdersDraft() {
        try { return JSON.parse(localStorage.getItem("ezohata:v2:orders") || "null"); }
        catch { return null; }
      }

      function setManualOrdersStatus(message, isError = false) {
        state.manualOrders.status = message;
        state.manualOrders.error = Boolean(isError);
      }

      function getManualOrdersUnavailableMessage() {
        if (!state.googleAuth.configured) {
          return "Google OAuth client is not configured in sheet-config.json yet.";
        }
        if (!state.googleAuth.accessToken) {
          return "Google OAuth обязателен. Подключите Google, чтобы открыть orders и пересчитать сводки.";
        }
        return "Orders workbook is not available right now.";
      }

      async function syncManualOrdersForCurrentRange(startDate, endDate) {
        if (!state.data) return;
        if (state.manualOrders.data) {
          applyManualOrdersToDashboard(startDate, endDate);
          return;
        }
        try {
          if (hasConfiguredManualOrdersEndpoint()) {
            const payload = await getManualOrdersSheetDirect();
            state.manualOrders.data = buildManualOrdersStateFromPayload(payload);
          } else if (getLocalOrdersDraft()) {
            openLocalManualOrders("Открыт локальный orders draft.", false);
          }
        } catch (error) {
          setManualOrdersStatus(error.message || "Не удалось загрузить orders.", true);
        }
        applyManualOrdersToDashboard(startDate, endDate);
      }

      function applyManualOrdersToDashboard(startDate = elements.startDate.value, endDate = elements.endDate.value) {
        if (!state.data || !state.data.tabs) return;
        const visible = getVisibleManualOrdersRows(startDate, endDate);
        if (!visible.headers.length) return;
        state.data.tabs.orders = {
          ...(state.data.tabs.orders || {}),
          sheetName: state.manualOrders.data?.sheetName || state.data.tabs.orders?.sheetName || MANUAL_ORDERS_SHEET_NAME,
          values: [visible.headers.slice(), ...visible.rows.map((row) => row.slice())],
          headerRowIndex: 0,
          sourceType: state.manualOrders.data?.sourceType || state.data.tabs.orders?.sourceType || "manual-orders"
        };
        state.data.ordersSummary = buildOrdersSummaryFromClient(state.data.tabs.orders.values);
      }

      function getVisibleManualOrdersRows(startDate = elements.startDate.value, endDate = elements.endDate.value) {
        const data = state.manualOrders.data;
        if (!data) {
          const fallbackValues = state.data?.tabs?.orders?.values || [];
          return {
            headers: (fallbackValues[0] || []).slice(),
            rows: fallbackValues.slice(1).map((row) => row.slice())
          };
        }
        const dateIndex = findDateColumnIndex(data.headers);
        const start = parseIsoDate(startDate || "1970-01-01");
        const end = parseIsoDate(endDate || startDate || "2999-12-31");
        const rows = data.rows.filter((row) => {
          if (!hasAnyValue(row)) return false;
          const cellDate = dateIndex === -1 ? null : parseDisplayDate(row[dateIndex]);
          if (!cellDate) return false;
          return cellDate >= start && cellDate <= end;
        });
        return {
          headers: data.headers.slice(),
          rows: rows.map((row) => padRowToWidth(row.slice(), data.headers.length))
        };
      }

      function buildOrdersSummaryFromClient(values) {
        if (!values.length) {
          return { orderRows: 0, totalAccruedPlus3Pct: 0, totalReceivedUsd: 0 };
        }
        const header = values[0] || [];
        const accruedIndex = findHeaderIndexByAliases(header, ["ACCRUED +3%", "СТОИМОСТЬ", "COST", "PRICE BASE"]);
        const receivedIndex = findHeaderIndexByAliases(header, ["ПОЛУЧЕНО В ДОЛЛАРАХ ИТОГО (СВОДНЫЙ)", "RECEIVED TOTAL USD"]);
        let totalAccrued = 0;
        let totalReceived = 0;
        let orderRows = 0;
        values.slice(1).forEach((row) => {
          if (!hasAnyValue(row)) return;
          if (isTableTotalRow(row)) return;
          orderRows += 1;
          if (accruedIndex !== -1 && accruedIndex < row.length) totalAccrued += parseLooseNumber(row[accruedIndex]);
          if (receivedIndex !== -1 && receivedIndex < row.length) totalReceived += parseLooseNumber(row[receivedIndex]);
        });
        return {
          orderRows,
          totalAccruedPlus3Pct: roundTo2(totalAccrued),
          totalReceivedUsd: roundTo2(totalReceived)
        };
      }

      async function applyClientSideDerivedData(startDate, endDate) {
        if (!state.data?.tabs) return;
        applyManualOrdersToDashboard(startDate, endDate);
        let aggregatedManual = null;
        if (hasConfiguredManualFinanceEndpoint()) {
          try {
            aggregatedManual = await aggregateClosedManualPeriodDataDirect(startDate, endDate);
          } catch (error) {
            setManualFinanceStatus(error.message || "Не удалось собрать агрегированные входящие данные.", true);
          }
        }
        if (!aggregatedManual && state.manualFinance.data) {
          aggregatedManual = {
            rows: buildAnalyticsManualRowsFromFactMoneyRows(
              state.manualFinance.data.moneyRows || [],
              state.manualFinance.data.transferRows || []
            ),
            transferRows: buildAnalyticsTransfersFromFactRows(state.manualFinance.data.transferRows || []),
            selectedSheets: [state.manualFinance.data.sourceSheetName || MANUAL_INCOMING_TITLE]
          };
        }

        const payoutsValues = state.data.tabs.payouts?.values || [];
        if (state.data.tabs.payouts) {
          state.data.tabs.payouts = {
            ...state.data.tabs.payouts,
            closedFactTransferHeaders: MANUAL_TRANSFER_HEADERS.slice(),
            closedFactTransfers: aggregatedManual
              ? (aggregatedManual.transferRows || []).map((row) => [
                  row.date || "",
                  row.who || "",
                  row.amount || "",
                  row.localCurrency || "",
                  row.destination || "",
                  row.rate || "",
                  row.usdAmount || ""
                ])
              : []
          };
        }

        const shouldRebuildAnalytics = Boolean(
          state.data.tabs.analytics && (
            aggregatedManual ||
            state.data.tabs.movement?.sourceType === "live-source-csv" ||
            state.data.tabs.payouts?.sourceType === "live-source-csv"
          )
        );
        if (shouldRebuildAnalytics) {
          state.data.tabs.analytics = {
            ...state.data.tabs.analytics,
            values: normalizePlanGrowthFormula(
              buildFullRangeBasedAnalyticsValuesFromClosedFact(
                state.data.tabs.analytics.values || [],
                state.data.tabs.movement?.values || [],
                payoutsValues,
                state.data.tabs.savings?.values || [],
                aggregatedManual || { rows: [], transferRows: [], selectedSheets: [] }
              )
            ),
            headerRowIndex: -1,
            sourceType: aggregatedManual ? "closed-range-aggregation" : "live-overlay-aggregation",
            selectedClosedSheets: aggregatedManual?.selectedSheets || []
          };
        }

        if (state.data.tabs.movement) {
          state.data.tabs.movement.summaryRows = buildMovementSummaryRows(
            state.data.tabs.movement.values || [],
            state.data.tabs.orders?.values || [],
            state.data.tabs.payouts?.values || [],
            state.data.tabs.movement.summaryRows || []
          );
        }
        state.data.ordersSummary = buildOrdersSummaryFromClient(state.data.tabs.orders?.values || []);
      }

      function renderTabExportActions(tabId) {
        const actions = document.createElement("div");
        actions.className = "tab-actions";
        appendExportButtons(actions, tabId);
        return actions;
      }

      function appendExportButtons(container, tabId) {
        const excelButton = document.createElement("button");
        excelButton.type = "button";
        excelButton.className = "ghost";
        excelButton.textContent = "Скачать Excel-овский файл";
        excelButton.disabled = !getExportRowsForTab(tabId).length;
        excelButton.addEventListener("click", () => downloadTabXlsx(tabId));
        container.appendChild(excelButton);

        if (tabId === "movement") return;

        const csvButton = document.createElement("button");
        csvButton.type = "button";
        csvButton.className = "ghost";
        csvButton.textContent = "Скачать CSV";
        csvButton.disabled = !getExportRowsForTab(tabId).length;
        csvButton.addEventListener("click", () => downloadTabCsv(tabId));
        container.appendChild(csvButton);

        const copyButton = document.createElement("button");
        copyButton.type = "button";
        copyButton.className = "ghost";
        copyButton.textContent = "Копировать Excel";
        copyButton.disabled = !getExportRowsForTab(tabId).length;
        copyButton.addEventListener("click", () => copyTabTsv(tabId));
        container.appendChild(copyButton);
      }

      function downloadTabCsv(tabId) {
        const rows = getExportRowsForTab(tabId);
        if (!rows.length) return;
        const exportRows = prepareRowsForExport(rows, "csv");
        const csv = exportRows.map((row) => (row || []).map(escapeCsvCell).join(",")).join("\r\n");
        const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = buildDownloadFileName(getSheetNameForExport(tabId), "csv");
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      async function copyTabTsv(tabId) {
        const rows = getExportRowsForTab(tabId);
        if (!rows.length) return;
        const exportRows = prepareRowsForExport(rows, "tsv");
        const tsv = exportRows.map((row) => (row || []).map((cell) => String(cell ?? "")).join("\t")).join("\n");
        try {
          await navigator.clipboard.writeText(tsv);
          setStatus("Таблица скопирована в Excel-совместимом формате.");
        } catch (error) {
          setStatus("Не удалось скопировать таблицу в буфер обмена.", true);
        }
      }

      function downloadTabXlsx(tabId) {
        const rows = getExportRowsForTab(tabId);
        if (!rows.length) return;
        if (typeof XLSX === "undefined" || !XLSX?.utils) {
          setStatus("XLSX библиотека не загрузилась.", true);
          return;
        }
        const exportRows = prepareRowsForExport(rows, "xlsx");
        const workbook = XLSX.utils.book_new();
        const worksheet = XLSX.utils.aoa_to_sheet(exportRows);
        XLSX.utils.book_append_sheet(workbook, worksheet, sanitizeSheetName(getSheetNameForExport(tabId)));
        XLSX.writeFile(workbook, buildDownloadFileName(getSheetNameForExport(tabId), "xlsx"));
      }

      function prepareRowsForExport(rows, mode = "xlsx") {
        return (rows || []).map((row) => (row || []).map((cell) => coerceExportCell(cell, mode)));
      }

      function coerceExportCell(value, mode = "xlsx") {
        if (typeof value === "number") return value;
        const raw = String(value ?? "").trim();
        if (isManualFinanceFormula(raw)) {
          const evaluated = evaluateManualFinanceFormula(raw, []);
          if (evaluated !== null && Number.isFinite(evaluated)) {
            return mode === "xlsx" ? evaluated : String(evaluated);
          }
        }
        if (!looksLikeExportNumber(raw)) return String(value ?? "");
        const numeric = parseLooseNumber(raw);
        if (!Number.isFinite(numeric)) return String(value ?? "");
        return mode === "xlsx" ? numeric : String(numeric);
      }

      function looksLikeExportNumber(value) {
        const raw = String(value || "").trim();
        if (!raw) return false;
        if (isManualFinanceFormula(raw) && evaluateManualFinanceFormula(raw, []) !== null) return true;
        if (/^\d{2}\.\d{2}\.\d{4}$/.test(raw) || /^\d{4}-\d{2}-\d{2}$/.test(raw)) return false;
        if (!/^-?\d[\d\s.,]*$/.test(raw)) return false;
        return /\d/.test(raw);
      }

      function getSheetNameForExport(tabId) {
        if (tabId === "manualFinance") {
          return state.manualFinance.data?.sheetName || "incoming-ledger";
        }
        if (tabId === "orders") {
          return state.manualOrders.data?.sheetName || MANUAL_ORDERS_SHEET_NAME;
        }
        if (tabId === "savings") {
          return "Переводы";
        }
        return state.data?.tabs?.[tabId]?.sheetName || tabId;
      }

      function getExportRowsForTab(tabId) {
        if (tabId === "manualFinance") {
          return getManualFinanceExportRows();
        }
        if (tabId === "orders") {
          return getManualOrdersExportRows();
        }
        if (tabId === "savings") {
          return getTransfersExportRows();
        }
        const tabData = state.data?.tabs?.[tabId];
        const rows = clone2dArray(tabId === "analytics" ? getAnalyticsMergedValues() : (tabData?.values || []));
        if (tabId === "analytics") {
          return getAnalyticsExportRows(rows);
        }
        if (tabId === "payouts") {
          return getUnifiedPayoutExportRows(rows);
        }
        return rows;
      }

      function getUnifiedPayoutExportRows(payoutRows) {
        const rows = clone2dArray(payoutRows || []);
        if (!rows.length) return rows;
        const transferRows = getNormalizedPayoutTransferRows().rows;
        if (!transferRows.length) return rows;
        return mergePayoutsWithClosedTransfers(rows, transferRows);
      }

      function getTransfersTabValues() {
        if (state.manualTransfers.data?.transferRows) {
          return [
            (state.manualTransfers.data.transferHeaders || MANUAL_TRANSFER_HEADERS).slice(),
            ...state.manualTransfers.data.transferRows.map((row) => [
              row.transferDate || "",
              row.who || "",
              row.amount || "",
              row.currency || "",
              row.channel || "",
              row.rate || "",
              row.usdAmount || ""
            ])
          ];
        }
        return [];
      }

      function getTransfersExportRows() {
        return getTransfersTabValues();
      }

      function getAnalyticsExportRows(values) {
        const sections = getAnalyticsSections(values);
        if (!sections.length) return values;
        const output = [];
        sections.forEach((section, index) => {
          if (index > 0) output.push([]);
          output.push([section.title]);
          section.rows.forEach((row) => output.push((row || []).map((cell) => coerceAnalyticsExportCell(cell))));
        });
        return output;
      }

      function coerceAnalyticsExportCell(value) {
        const raw = String(value ?? "").trim();
        if (!raw) return "";
        if (isManualFinanceFormula(raw)) {
          const evaluated = evaluateManualFinanceFormula(raw, []);
          if (evaluated !== null) return evaluated;
        }
        if (looksLikeExportNumber(raw)) {
          const numeric = parseLooseNumber(raw);
          if (Number.isFinite(numeric)) return numeric;
        }
        return value;
      }

      function getManualFinanceExportRows() {
        if (!state.manualFinance.data) return [];
        const moneyRows = state.manualFinance.data.moneyRows || [];
        const usdRateLookup = buildManualFinanceUsdRateLookup(
          state.manualFinance.data.transferRows,
          state.data?.tabs?.movement?.values || []
        );
        return [
          [state.manualFinance.data.moneyTitle || MANUAL_FINANCE_MONEY_TITLE],
          getManualFinanceDisplayHeaders(state.manualFinance.data.moneyHeaders || MANUAL_FINANCE_HEADERS),
          ...moneyRows.map((row, rowIndex) => [
            row.channel || "",
            normalizeManualFinancePersistedNumberInput(row.now, { rows: moneyRows, rowIndex, key: "now" }),
            normalizeManualFinancePersistedNumberInput(row.serviceIncome, { rows: moneyRows, rowIndex, key: "serviceIncome" }),
            normalizeManualFinancePersistedNumberInput(row.business, { rows: moneyRows, rowIndex, key: "business" }),
            normalizeManualFinancePersistedNumberInput(row.house, { rows: moneyRows, rowIndex, key: "house" }),
            normalizeManualFinancePersistedNumberInput(row.food, { rows: moneyRows, rowIndex, key: "food" }),
            normalizeManualFinancePersistedNumberInput(row.study, { rows: moneyRows, rowIndex, key: "study" }),
            normalizeManualFinancePersistedNumberInput(row.travelFun, { rows: moneyRows, rowIndex, key: "travelFun" }),
            row.total || "",
            normalizeManualFinancePersistedNumberInput(row.exchange, { rows: moneyRows, rowIndex, key: "exchange" }),
            getManualFinanceTotalUsdValue(row, usdRateLookup),
            getManualFinanceNowUsdValue(row, usdRateLookup)
          ]),
          [],
          [state.manualFinance.data.transferTitle || MANUAL_FINANCE_TRANSFER_TITLE],
          [...(state.manualFinance.data.transferHeaders || MANUAL_TRANSFER_HEADERS)],
          ...state.manualFinance.data.transferRows.map((row) => [
            row.transferDate ?? "",
            row.who ?? "",
            normalizeManualFinancePersistedNumberInput(row.amount),
            row.currency ?? "",
            row.channel ?? "",
            normalizeManualFinancePersistedNumberInput(row.rate),
            normalizeManualFinancePersistedNumberInput(row.usdAmount)
          ])
        ];
      }

      function getManualOrdersExportRows() {
        if (state.manualOrders.data) {
          return [state.manualOrders.data.headers.slice(), ...state.manualOrders.data.rows.map((row) => row.slice())];
        }
        return clone2dArray(state.data?.tabs?.orders?.values || []);
      }

      function sanitizeSheetName(value) {
        return String(value || "Sheet1").replace(/[\\/?*:[\]]/g, " ").trim().slice(0, 31) || "Sheet1";
      }

      function isTableTotalLabel(value) {
        const normalized = normalizeCell(value);

        const datePart = `${elements.startDate.value || "start"}_${elements.endDate.value || "end"}`;
        const safeSheetName = String(sheetName || "dashboard").replace(/[^\p{L}\p{N}_-]+/gu, "_").replace(/^_+|_+$/g, "");

        const totalAccrued = seventyTotal + ordersReceivedUsd;
        const percent = accruedTotal - priceTotal;

        const totalBalance = payoutUsdTotal - totalAccrued;
        return [

      async function aggregateClosedManualPeriodDataDirect(startDate, endDate) {

          : buildIncomingExpenseSheetValues([]);

            who: row.who || "",
            amount: row.amount || "",
            localCurrency: row.currency || "",
            rate: row.rate || "",
            usdAmount: row.usdAmount || "",
            destination: row.channel || ""
          }));
        const expenseRows = normalizeManualFinanceExpenseRows(
          parseIncomingExpenseSheetValues(expenseValues).filter((row) => row.date && row.date >= startDate && row.date <= endDate),
          startDate,
          endDate
        );
        return {
          rows: buildManualFinanceSummaryRows(expenseRows),

          selectedSheets: [getManualExpensesSheetName(), getManualTransfersSheetName()]

        const balanceSection = {

      function calculatePayoutChannelStats(payoutValues, transferRows) {
        const stats = Object.fromEntries(
          MANUAL_FINANCE_MONEY_CHANNELS.map((channel) => [
            channel,
            {
              local: 0,
              usd: 0
            }
          ])
        );
        const header = (payoutValues || [])[0] || [];
        const paymentMethodIndex = findHeaderIndexByAliases(header, ["PAYMENT METHOD", "DESTINATION", "канал куда"]);
        const currentAmountIndex = findHeaderIndexByAliases(header, ["СУММА ТЕКУЩАЯ", "сумма"]);
        const usdAmountIndex = findHeaderIndexByAliases(header, ["AMOUNT (USD)", "сумма в долларах"]);
          if (paymentMethodIndex !== -1 && usdAmountIndex !== -1) {
          (payoutValues || []).slice(1).forEach((row) => {
            if (!hasAnyValue(row) || isTableTotalLabel(normalizeCell(row[0]))) return;
            const channel = resolvePaymentChannel(row[paymentMethodIndex]);
            if (!channel || !stats[channel]) return;
            if (currentAmountIndex !== -1) stats[channel].local += normalizePayoutAmount(row[currentAmountIndex]);
            stats[channel].usd += normalizePayoutAmount(row[usdAmountIndex]);
          });
        }
        (transferRows || []).forEach((row) => {
          const channel = Array.isArray(row)
            ? String(row[4] || "").trim()
            : String(row?.destination || row?.channel || "").trim();
          if (!channel || !stats[channel]) return;
          stats[channel].local += normalizePayoutAmount(Array.isArray(row) ? row[2] : row.amount);
          stats[channel].usd += normalizePayoutAmount(Array.isArray(row) ? row[6] : row.usdAmount);
        });
        return stats;
      }

      function normalizePayoutAmount(value) {
        const amount = parseLooseNumber(value);
        return amount ? -Math.abs(amount) : 0;
      }

      function resolvePaymentChannel(value) {
        const raw = String(value || "").trim();
        if (!raw) return "";
        const exact = MANUAL_FINANCE_MONEY_CHANNELS.find((channel) => normalizeCell(channel) === normalizeCell(raw));
        if (exact) return exact;
        const normalized = normalizeLookupText(raw);
        const entry = Object.entries(ANALYTICS_PAYMENT_RULES).find(([, rule]) => {
          return [...(rule.localPatterns || []), ...(rule.usdPatterns || [])].some((pattern) => pattern.test(raw) || pattern.test(normalized));
        });
        return entry ? entry[0] : "";
      }

      function normalizeLookupText(value) {
        return String(value || "")
          .trim()
          .toLowerCase()
          .replace(/ё/g, "е")
          .replace(/[^0-9a-zа-я]+/g, " ")
          .replace(/\s+/g, " ")
          .trim();
      }

      function sumChannelStat(stats, key) {
        return Object.values(stats || {}).reduce((sum, row) => sum + parseLooseNumber(row?.[key]), 0);
      }

      function findHeaderIndexByAliases(header, aliases) {
        const normalizedAliases = new Set((aliases || []).map((alias) => normalizeCell(alias)));
        return (header || []).findIndex((cell) => normalizedAliases.has(normalizeCell(cell)));
      }

      function buildManualTotalLookup(rows) {

          if (!channel || channel === MANUAL_FINANCE_TOTAL_LABEL) return;
          totals[channel] = parseLooseNumber(row.total);

      function buildManualTotalUsdLookup(rows) {

      function buildManualExchangeUsdLookup(rows) {

      function buildManualNowUsdLookup(rows) {
        const lookup = {};

          const channel = String(row.channel || "").trim();
          if (!channel || channel === MANUAL_FINANCE_TOTAL_LABEL) return;

      function buildAnalyticsNowUsdLookup(sectionRows) {
        const rows = sectionRows || [];
        const header = rows[0] || [];
        const nowUsdIndex = findHeaderIndexByAliases(header, ["now_usd", "now usd"]);
        if (nowUsdIndex === -1) return {};
        const lookup = {};
        rows.slice(1).forEach((row) => {
          const channel = String(row?.[0] || "").trim();
          if (!channel || channel === MANUAL_FINANCE_TOTAL_LABEL) return;
          lookup[channel] = parseLooseNumber(row[nowUsdIndex]);
        });
        return lookup;
      }

      function buildSavingsLookup(values) {
        if (!values.length) return {};
        const lookup = {};
        values.slice(1).forEach((row) => {
          if (!hasAnyValue(row)) return;
          const channel = String(row[0] || "").trim();
          if (!channel || normalizeCell(channel) === normalizeCell("итого")) return;
          const numericCells = row.slice(1).filter((cell) => String(cell || "").trim()).map((cell) => parseLooseNumber(cell));
          lookup[channel] = numericCells[0] || 0;
        });
        return lookup;
      }

      function extractLegacyBalanceExtraLookup(sections) {
        if ((sections || []).length < 3) return {};
        const lookup = {};
        (sections[2]?.rows || []).forEach((row) => {
          if (!hasAnyValue(row)) return;
          const channel = String(row[0] || "").trim();
          if (!channel || channel === MANUAL_FINANCE_TOTAL_LABEL) return;
          lookup[channel] = String(row[6] || "").trim();
