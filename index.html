<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>EzoHata Incoming Ledger</title>
    <style>
      :root {
        --bg: #f4efe6;
        --panel: #fffaf2;
        --panel-2: #fff;
        --ink: #221b16;
        --muted: #70665b;
        --line: #d8cbbb;
        --accent: #98643a;
        --accent-2: #2f6f5e;
        --danger: #9d3d31;
        --shadow: 0 14px 36px rgba(34, 27, 22, 0.08);
      }
      * { box-sizing: border-box; }
      html, body { overflow-x: hidden; }
      body {
        margin: 0;
        font-family: "Trebuchet MS", "Segoe UI", sans-serif;
        color: var(--ink);
        padding:
          env(safe-area-inset-top)
          max(8px, env(safe-area-inset-right))
          env(safe-area-inset-bottom)
          max(8px, env(safe-area-inset-left));
        background:
          radial-gradient(circle at top right, rgba(152, 100, 58, 0.12), transparent 26%),
          linear-gradient(180deg, #f7f2e9 0%, #efe7da 100%);
      }
      .page { width: min(1400px, calc(100% - 24px)); margin: 20px auto 40px; }
      .hero, .panel {
        background: rgba(255, 250, 242, 0.9);
        border: 1px solid rgba(216, 203, 187, 0.9);
        border-radius: 24px;
        box-shadow: var(--shadow);
        backdrop-filter: blur(12px);
        overflow: hidden;
      }
      .hero { padding: 22px; display: grid; gap: 16px; }
      .hero-top { display: flex; justify-content: space-between; gap: 16px; align-items: start; }
      h1 { margin: 0; font-size: clamp(28px, 4vw, 44px); line-height: 0.96; letter-spacing: -0.03em; text-wrap: balance; }
      h2, h3, p { margin: 0; }
      .subtle { margin: 6px 0 0; color: var(--muted); max-width: 760px; overflow-wrap: anywhere; }
      .status {
        padding: 10px 12px; border-radius: 14px; background: rgba(47, 111, 94, 0.08);
        color: var(--accent-2); font-size: 13px; min-width: 0; overflow-wrap: anywhere;
      }
      .status.error { background: rgba(157, 61, 49, 0.1); color: var(--danger); }
      .controls { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 12px; }
      .field, .actions {
        background: var(--panel-2); border: 1px solid var(--line); border-radius: 18px; padding: 14px;
      }
      .field label { display: block; font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 8px; }
      .field input, .field textarea, .finance-input {
        width: 100%; padding: 10px 12px; font: inherit; border: 1px solid var(--line);
        border-radius: 12px; background: #fffdf9; color: var(--ink);
      }
      .field textarea { min-height: 72px; resize: vertical; }
      .actions { display: flex; gap: 10px; align-items: end; justify-content: flex-start; flex-wrap: wrap; }
      button {
        appearance: none; border: 0; border-radius: 999px; padding: 11px 16px; font: inherit; font-weight: 700;
        cursor: pointer; transition: transform 0.16s ease, opacity 0.16s ease, background 0.16s ease;
        min-width: 0; white-space: normal; text-wrap: balance; touch-action: manipulation;
      }
      button:hover { transform: translateY(-1px); }
      button:disabled { cursor: wait; opacity: 0.6; transform: none; }
      .primary { background: var(--accent); color: #fff9f0; }
      .secondary { background: #ece2d3; color: var(--ink); }
      .ghost { background: #fff; color: var(--accent); border: 1px solid var(--line); }
      .metrics { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 12px; }
      .metric {
        padding: 16px; background: linear-gradient(180deg, rgba(255,255,255,0.9), rgba(247,239,230,0.85));
        border: 1px solid var(--line); border-radius: 18px;
      }
      .metric-label { font-size: 12px; text-transform: uppercase; letter-spacing: 0.08em; color: var(--muted); }
      .metric-value { margin-top: 8px; font-size: clamp(24px, 3vw, 34px); font-weight: 700; }
      .panel { margin-top: 18px; padding: 18px; }
      .tabs { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; overflow-x: auto; scrollbar-width: thin; padding-bottom: 2px; }
      .tab { background: #efe3d3; color: #503b2f; }
      .tab.active { background: #2f6f5e; color: #f5fbf8; box-shadow: 0 10px 22px rgba(47, 111, 94, 0.2); }
      .tab-panel { display: none; gap: 14px; min-width: 0; }
      .tab-panel.active { display: grid; }
      .tab-panel > * { min-width: 0; }
      .tab-header { display: flex; justify-content: space-between; gap: 12px; align-items: center; }
      .tab-header > * { min-width: 0; }
      .tab-header h2 { margin: 0; font-size: 22px; }
      .panel-context {
        display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin-bottom: 14px; padding: 12px 14px;
        border: 1px solid var(--line); border-radius: 16px; background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(247,239,230,0.88));
      }
      .tab-note, .config-note { color: var(--muted); font-size: 14px; overflow-wrap: anywhere; }
      .panel-pill {
        display: inline-flex; align-items: center; padding: 6px 10px; border-radius: 999px; background: #2f6f5e;
        color: #f5fbf8; font-size: 12px; font-weight: 700; letter-spacing: 0.04em; text-transform: uppercase;
      }
      .panel-pill.warn { background: #9d3d31; }
      .table-wrap {
        width: 100%;
        max-width: 100%;
        min-width: 0;
        overflow: auto;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: white;
        overscroll-behavior-x: contain;
        touch-action: pan-x pan-y;
      }
      table { width: 100%; border-collapse: collapse; min-width: 720px; }
      th, td {
        padding: 10px 12px; border-bottom: 1px solid #eee3d5; border-right: 1px solid #f1e8dd;
        text-align: left; vertical-align: top; font-size: 14px;
      }
      th {
        position: sticky; top: 0; background: #f9f2e8; z-index: 1;
        font-size: 12px; text-transform: uppercase; letter-spacing: 0.06em;
      }
      tr:nth-child(even) td { background: #fffcf7; }
      .empty { padding: 24px; color: var(--muted); text-align: center; }
      .finance-shell { display: grid; gap: 16px; }
      .finance-meta {
        display: grid; gap: 10px; padding: 14px 16px; border: 1px solid var(--line); border-radius: 18px;
        background: linear-gradient(180deg, rgba(255,255,255,0.92), rgba(247,239,230,0.82));
      }
      .finance-status {
        padding: 10px 12px; border-radius: 14px; background: rgba(47, 111, 94, 0.08);
        color: var(--accent-2); font-size: 13px; overflow-wrap: anywhere;
      }
      .finance-status.error { background: rgba(157, 61, 49, 0.1); color: var(--danger); }
      .finance-actions, .tab-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
      .movement-export-actions { display: flex; gap: 10px; align-items: center; justify-content: flex-start; margin: 10px 0 14px; }
      .readonly-cell { color: var(--muted); font-weight: 700; }
      .rate-table-wrap { margin-bottom: 12px; }
      .rate-table-wrap table { width: auto; min-width: min(100%, 420px); }
      .rate-table-wrap th,
      .rate-table-wrap td { white-space: nowrap; }
      .date-tags { display: flex; flex-wrap: wrap; gap: 8px; }
      .date-tag { padding: 6px 10px; border-radius: 999px; background: #efe3d3; color: #503b2f; font-size: 12px; }
      .mobile-cards { display: none; }
      .mobile-card {
        display: grid; gap: 10px; padding: 14px; border-bottom: 1px solid #eee3d5;
        background: linear-gradient(180deg, #fffdf9, #fcf5eb);
      }
      .mobile-card:last-child { border-bottom: 0; }
      .mobile-card-title { font-size: 15px; font-weight: 700; }
      .mobile-card-grid { display: grid; gap: 8px; }
      .mobile-card-row { display: grid; gap: 2px; }
      .mobile-card-label { font-size: 11px; text-transform: uppercase; letter-spacing: 0.06em; color: var(--muted); }
      .mobile-card-value { font-size: 14px; line-height: 1.35; overflow-wrap: anywhere; }
      .desktop-table { display: block; }
      .mobile-table { display: none; }
      .analytics-section + .analytics-section { margin-top: 18px; }
      .movement-summary {
        margin-top: 16px;
        width: 100%;
        max-width: 100%;
        min-width: 0;
        border: 1px solid var(--line);
        border-radius: 18px;
        background: linear-gradient(180deg, rgba(255,255,255,0.96), rgba(247,239,230,0.88));
        overflow: auto;
        -webkit-overflow-scrolling: touch;
      }
      .movement-summary-title {
        padding: 14px 16px 0;
        font-size: 14px;
        font-weight: 700;
      }

      @media (max-width: 980px) {
        .controls, .metrics { grid-template-columns: repeat(2, minmax(0, 1fr)); }
        .hero-top, .tab-header { flex-direction: column; align-items: stretch; }
      }
      @media (max-width: 680px) {
        .page { width: min(1400px, calc(100% - 10px)); margin-top: 8px; margin-bottom: 20px; }
        .controls, .metrics { grid-template-columns: 1fr; }
        .actions button, .finance-actions button, .tab-actions button, .movement-export-actions button { width: 100%; }
        .hero, .panel { border-radius: 18px; }
        .hero { padding: 16px; }
        .panel { padding: 14px; }
        .status { width: 100%; font-size: 12px; }
        .finance-meta { padding: 12px; }
        .config-note, .tab-note { font-size: 13px; }
        .movement-export-actions,
        .finance-actions,
        .tab-actions { display: grid; grid-template-columns: 1fr; }
        .tabs {
          display: grid;
          grid-template-columns: repeat(3, minmax(0, 1fr));
          overflow: visible;
          margin: 0 0 14px;
          gap: 8px;
        }
        .tab {
          width: 100%;
          padding: 12px 10px;
          font-size: 14px;
          line-height: 1.15;
        }
        .tab-header h2 { font-size: 18px; }
        table { min-width: 560px; }
        th, td { padding: 8px 9px; font-size: 12px; }
        .finance-input { min-width: 84px; padding: 8px 10px; font-size: 12px; }
        .table-wrap { -webkit-overflow-scrolling: touch; }
        .table-wrap table tr > :first-child {
          position: sticky;
          left: 0;
          z-index: 2;
          background: #fffaf2;
        }
      }
    </style>
  </head>
  <body>
    <div class="page">
      <section class="hero">
        <div class="hero-top">
          <div>
            <h1>EzoHata<br />Incoming Ledger</h1>
            <p class="subtle">
              Новый контур оставляет в интерфейсе только legacy `fact`, а скрытый репозиторий `Переводы` + `Расходы`
              собирается автоматически при сохранении fact за выбранный период.
            </p>
          </div>
          <div id="status" class="status" aria-live="polite">Готово к загрузке.</div>
        </div>

        <div class="controls">
          <div class="field">
            <label for="startDate">Дата начала</label>
            <input id="startDate" type="date" />
          </div>
          <div class="field">
            <label for="endDate">Дата окончания</label>
            <input id="endDate" type="date" />
          </div>
          <div class="actions">
            <button id="todayButton" class="secondary" type="button">Сегодня</button>
            <button id="weekButton" class="secondary" type="button">Неделя</button>
            <button id="calculateButton" class="primary" type="button">Рассчитать</button>
            <button id="connectGoogleButton" class="ghost" type="button">Подключить Google</button>
            <button id="disconnectGoogleButton" class="ghost" type="button">Отключить</button>
          </div>
          <div class="field">
            <label>Snapshot + analytics</label>
            <div class="config-note" id="endpointLabel"></div>
          </div>
          <div class="field">
            <label>Google Sheets access</label>
            <div class="config-note" id="manualEndpointLabel"></div>
          </div>
        </div>

        <div class="metrics">
          <div class="metric">
            <div class="metric-label">Итоговая сумма заказов</div>
            <div class="metric-value" id="metricPeriod">0</div>
          </div>
          <div class="metric">
            <div class="metric-label">Баланс</div>
            <div class="metric-value" id="metricOrders">0</div>
          </div>
          <div class="metric">
            <div class="metric-label">Сумма оплачена</div>
            <div class="metric-value" id="metricBalances">0</div>
          </div>
          <div class="metric">
            <div class="metric-label">Итого</div>
            <div class="metric-value" id="metricTransfers">0</div>
          </div>
        </div>
      </section>

      <section class="panel">
        <div class="tabs" id="tabs"></div>
        <div id="tabPanels"></div>
      </section>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
    <script src="./analytics-payouts-helper.js"></script>
    <script src="./manual-finance-formulas.js"></script>
    <script src="./orders-helper.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
    <script>
      const APP_BUILD_VERSION = "2026.04.25.04";
      const FILE_PROTOCOL_DASHBOARD_ORIGIN = "https://ezohata-incoming-ledger.vercel.app";
      const URL_PARAMS = new URLSearchParams(location.search);
      const MANUAL_INCOMING_TITLE = "fact";
      const MANUAL_FINANCE_MONEY_TITLE = "расходы по каналам";
      const MANUAL_FINANCE_TRANSFER_TITLE = "Переводы";
      const MANUAL_FINANCE_EXPENSE_TITLE = "Расходы";
      const MANUAL_FINANCE_TOTAL_LABEL = "Итого";
      const ANALYTICS_FACT_IMPORT_SHEET = "MANUAL_INPUTS_IMPORT";
      const MANUAL_DATE_RE = /^\d{4}-\d{2}-\d{2}$/;
      const MANUAL_FINANCE_FALLBACK_USD_RATES = {
        RUB: 1 / 84.5563,
        UAH: 1 / 43.86,
        EUR: 1.16,
        CAD: 0.74,
        LOCAL: 1 / 18
      };
      const MANUAL_FINANCE_HEADERS = [
        "канал", "now", "service income", "spent for business", "spent for flat", "spent for food", "spent for fun",
        "spent for travel", "затраты-мои", "обмен"
      ];
      const MANUAL_TRANSFER_HEADERS = ["дата перевода", "кто", "сумма", "валюта", "канал куда", "курс", "сумма в долларах"];
      const MANUAL_EXPENSE_TYPES = ["serviceIncome", "business", "flat", "food", "fun", "travel"];
      const MANUAL_NOW_CATEGORY = "now";
      const MANUAL_EXCHANGE_CATEGORY = "exchange";
      const MANUAL_INPUT_CATEGORIES = [...MANUAL_EXPENSE_TYPES, MANUAL_EXCHANGE_CATEGORY];
      const MANUAL_STORED_INPUT_CATEGORIES = [MANUAL_NOW_CATEGORY, ...MANUAL_INPUT_CATEGORIES];
      const MANUAL_TRANSFER_MIN_ROWS = 3;
      const ANALYTICS_PAYOUTS_HELPER = window.EzohataAnalyticsPayoutsHelper || {};
      const MANUAL_FINANCE_FORMULAS = window.EzohataManualFinanceFormulas || {};
      const ORDERS_HELPER = window.EzohataOrdersHelper || {};
      const MANUAL_ORDERS_SHEET_NAME = "Мои заказы";
      const MANUAL_ORDERS_LEGACY_SHEET_NAME = "MANUAL_ORDERS";
      const MANUAL_ORDERS_HEADERS = ORDERS_HELPER.SIMPLE_HEADERS || ["ДАТА", "ИМЯ", "ЗАКАЗ", "СТОИМОСТЬ"];
      const MANUAL_ORDERS_DEFAULT_ROWS = 1;
      const MOVEMENT_SOURCE_SPREADSHEET_FALLBACK_URL = "https://docs.google.com/spreadsheets/d/1v2ZvGdutjyMkW0FZqxJ3P0GRVuKPlNxG1lvZiUZlWvo/edit#gid=0";
      const SUMMARY_LABELS = {
        price: "1) прайс",
        accrued: "2) начислено прайс +%",
        percent: "3) %",
        receivedUsd: "4) получено в долларах",
        balance: "5) баланс",
        seventyPct: "6) 70% от прайс+%",
        orders: "7) мои заказы за этот период (4я вкладка)",
        totalAccrued: "8) ИТОГО НАЧИСЛЕНО",
        payout: "9) ОТПРАВЛЕНО",
        openingBalance: "остаток был",
        totalBalance: "10) ИТОГО БАЛАНС"
      };
      const ANALYTICS_PAYMENT_RULES = {
        "Яндекс руб": {
          currency: "RUB",
          localPatterns: [/сайт, рубли|сайт рубли/i],
          usdPatterns: [/сайт, рубли|сайт рубли/i]
        },
        "пейпал дол": {
          currency: "USD",
          usdPatterns: [/сайт, дол, пэйпэл|сайт, пэйпэл, дол/i]
        },
        "приват 24-грн": {
          currency: "UAH",
          localPatterns: [/приват фоп|фоп приват/i],
          usdPatterns: [/приват фоп|фоп приват/i]
        },
        "монобанк грн": {
          currency: "UAH",
          localPatterns: [/^(карта андрей|андрей карта)$/i],
          usdPatterns: [/^(карта андрей|андрей карта)$/i]
        },
        "Бинанс spot": {
          currency: "USD",
          usdPatterns: [/крипта, дол/i]
        }
      };
      const MANUAL_FINANCE_MONEY_CHANNELS = [
        "Яндекс руб","пейпал дол","пейпал евр","пейпал сad","приват 24-дол","приват 24-евро","приват 24-грн",
        "монобанк грн","трансервайз дол","трансервайз евро","REVOLUT дол","Payoneer - eur","Payoneer - dol",
        "Бинанс spot","binance save","Налично -я-евр","местная валюты","БАНК КАНАДА cad","нал-мам-евро","нал-мам-дол"
      ];

      const state = {
        config: null,
        snapshotPayload: null,
        activeTab: "movement",
        loading: false,
        data: null,
        googleAuth: {
          clientId: "",
          scopes: "",
          tokenClient: null,
          accessToken: "",
          configured: false,
          initialized: false,
          initializing: false,
          readyError: ""
        },
        manualFinance: {
          loading: false,
          data: null,
          periods: [],
          dirty: false,
          status: "",
          error: false
        },
        manualTransfers: {
          loading: false,
          data: null,
          dirty: false,
          status: "",
          error: false
        },
        manualOrders: {
          loading: false,
          data: null,
          dirty: false,
          status: "",
          error: false,
          textDraft: ""
        },
        analyticsFact: {
          periodStart: "",
          periodEnd: "",
          moneyTitle: "",
          moneyHeaders: [],
          moneyRows: []
        }
      };

      const elements = {
        startDate: document.getElementById("startDate"),
        endDate: document.getElementById("endDate"),
        status: document.getElementById("status"),
        endpointLabel: document.getElementById("endpointLabel"),
        manualEndpointLabel: document.getElementById("manualEndpointLabel"),
        metricPeriod: document.getElementById("metricPeriod"),
        metricOrders: document.getElementById("metricOrders"),
        metricBalances: document.getElementById("metricBalances"),
        metricTransfers: document.getElementById("metricTransfers"),
        tabs: document.getElementById("tabs"),
        tabPanels: document.getElementById("tabPanels"),
        todayButton: document.getElementById("todayButton"),
        weekButton: document.getElementById("weekButton"),
        calculateButton: document.getElementById("calculateButton"),
        connectGoogleButton: document.getElementById("connectGoogleButton"),
        disconnectGoogleButton: document.getElementById("disconnectGoogleButton")
      };

      init().catch((error) => setStatus(error.message || "Не удалось инициализировать dashboard.", true));

      async function init() {
        state.config = await loadConfig();
        elements.endpointLabel.textContent = `Server dashboard API | v${getConfiguredAppVersion()} | build ${APP_BUILD_VERSION}`;
        state.googleAuth.clientId = String(state.config?.googleAuth?.clientId || "").trim();
        state.googleAuth.scopes = String(state.config?.googleAuth?.scopes || "https://www.googleapis.com/auth/spreadsheets").trim();
        state.googleAuth.configured = Boolean(
          state.googleAuth.clientId &&
          state.googleAuth.clientId !== "PASTE_GOOGLE_OAUTH_CLIENT_ID"
        );
        elements.manualEndpointLabel.textContent = state.googleAuth.configured
          ? getOAuthReadinessMessage()
          : "Set googleAuth.clientId in sheet-config.json for fact/orders editing";
        await applyDefaultDatesFromSnapshot();
        elements.todayButton.addEventListener("click", setToday);
        elements.weekButton.addEventListener("click", setWeekRange);
        elements.calculateButton.addEventListener("click", () => loadDashboardData());
        elements.connectGoogleButton.addEventListener("click", () => connectGoogle(true));
        elements.disconnectGoogleButton.addEventListener("click", disconnectGoogle);
        await initializeGoogleAuth();
        if (state.googleAuth.readyError) {
          setManualFinanceStatus(state.googleAuth.readyError, true);
        }
        refreshAuthButtons();
        renderMetrics();
        renderTabs();
        await loadDashboardData();
      }

      function normalizeEndpointUrl(value) {
        const raw = String(value || "").trim();
        return raw ? raw.replace(/\/+$/, "") : "";
      }

      function getDashboardEndpoint() {
        const endpoint = normalizeEndpointUrl(state.config?.endpoint || "/api");
        if (!endpoint) return "";
        if (/^https?:\/\//i.test(endpoint)) return endpoint;
        if (window.location.protocol === "file:") {
          return `${FILE_PROTOCOL_DASHBOARD_ORIGIN}${endpoint.startsWith("/") ? endpoint : `/${endpoint}`}`;
        }
        return endpoint;
      }

      function hasConfiguredDashboardEndpoint() {
        return Boolean(getDashboardEndpoint());
      }

      async function callDashboardApi(startDate, endDate) {
        const endpoint = getDashboardEndpoint();
        const url = new URL(endpoint, window.location.href);
        url.searchParams.set("action", "getDashboardData");
        url.searchParams.set("startDate", startDate);
        url.searchParams.set("endDate", endDate);
        const response = await fetch(url.toString(), { cache: "no-store" });
        const payload = await response.json().catch(() => null);
        if (!response.ok || !payload?.ok || !payload?.data?.tabs) {
          throw new Error(payload?.error || `Dashboard endpoint failed (${response.status}).`);
        }
        return payload;
      }

      async function initializeGoogleAuth() {
        if (!state.googleAuth.configured) return;
        await waitForGoogleAccounts();
        state.googleAuth.tokenClient = google.accounts.oauth2.initTokenClient({
          client_id: state.googleAuth.clientId,
          scope: state.googleAuth.scopes,
          callback: (response) => {
            if (response?.error) {
              setManualFinanceStatus(response.error, true);
              return;
            }
            state.googleAuth.accessToken = response.access_token || "";
            refreshAuthButtons();
            setManualFinanceStatus("Google Sheets access granted. Пересчитываю все вкладки.", false);
            loadDashboardData().catch(() => {});
          }
        });
        state.googleAuth.initialized = true;
      }

      function waitForGoogleAccounts() {
        return new Promise((resolve, reject) => {
          const deadline = Date.now() + 10000;
          const tick = () => {
            if (window.google?.accounts?.oauth2) {
              resolve();
              return;
            }
            if (Date.now() > deadline) {
              reject(new Error("Google Identity Services failed to load."));
              return;
            }
            window.setTimeout(tick, 100);
          };
          tick();
        });
      }

      async function connectGoogle(interactive = true) {
        if (!state.googleAuth.configured) {
          setManualFinanceStatus("Сначала вставьте Google OAuth Client ID в sheet-config.json.", true);
          return;
        }
        if (!state.googleAuth.initialized) {
          await initializeGoogleAuth();
        }
        await new Promise((resolve, reject) => {
          state.googleAuth.tokenClient.callback = (response) => {
            if (response?.error) {
              reject(new Error(response.error));
              return;
            }
            state.googleAuth.accessToken = response.access_token || "";
            refreshAuthButtons();
            setManualFinanceStatus("Google подключен. Пересчитываю все вкладки за выбранный период.", false);
            renderTabs();
            loadDashboardData().catch(() => {});
            resolve();
          };
          try {
            state.googleAuth.tokenClient.requestAccessToken({
              prompt: interactive && !state.googleAuth.accessToken ? "consent" : ""
            });
          } catch (error) {
            reject(error);
          }
        });
      }

      function disconnectGoogle() {
        if (state.googleAuth.accessToken && window.google?.accounts?.oauth2) {
          google.accounts.oauth2.revoke(state.googleAuth.accessToken, () => {});
        }
        state.googleAuth.accessToken = "";
        state.manualFinance.data = null;
        state.manualOrders.data = null;
        refreshAuthButtons();
        renderMetrics();
        setStatus("Google доступ отключён. Серверные вкладки продолжают работать без авторизации.");
        setManualFinanceStatus("Google доступ отключён. Для fact и orders потребуется повторное подключение.", true);
        renderTabs();
      }

      function refreshAuthButtons() {
        const connected = Boolean(state.googleAuth.accessToken);
        elements.connectGoogleButton.textContent = connected ? "Google подключен" : "Подключить Google";
        elements.connectGoogleButton.disabled = connected || !state.googleAuth.configured;
        elements.disconnectGoogleButton.disabled = !connected;
        elements.manualEndpointLabel.textContent = connected
          ? "Connected via browser OAuth for fact/orders"
          : state.googleAuth.configured
            ? getOAuthReadinessMessage()
            : "Set googleAuth.clientId in sheet-config.json for fact/orders editing";
      }

      function getConfiguredAppVersion() {
        return String(state.config?.appVersion || "").trim() || "unversioned";
      }

      function getConfiguredOAuthOrigins() {
        return Array.isArray(state.config?.googleAuth?.authorizedJavaScriptOrigins)
          ? state.config.googleAuth.authorizedJavaScriptOrigins.map((origin) => String(origin || "").trim()).filter(Boolean)
          : [];
      }

      function isCurrentOriginDeclaredForOAuth() {
        const origins = getConfiguredOAuthOrigins();
        if (!origins.length) return false;
        return origins.includes(window.location.origin);
      }

      function getOAuthReadinessMessage() {
        const currentOrigin = window.location.origin;
        if (isCurrentOriginDeclaredForOAuth()) {
          return `OAuth configured for ${currentOrigin}. Browser login still must be verified manually in Google.`;
        }
        return `OAuth client configured, but ${currentOrigin} is not listed in sheet-config authorizedJavaScriptOrigins. Add it in config and Google Cloud Console.`;
      }

      async function loadConfig() {
        const response = await fetch("./sheet-config.json", { cache: "no-store" });
        if (!response.ok) throw new Error("Не удалось загрузить sheet-config.json.");
        const config = await response.json();
        if (!config?.tabs) throw new Error("sheet-config.json имеет неверный формат.");
        return config;
      }

      async function getSnapshotPayload() {
        if (state.snapshotPayload) return state.snapshotPayload;
        const response = await fetch("./sheet-snapshot.json", { cache: "no-store" });
        if (!response.ok) throw new Error("Не удалось загрузить sheet-snapshot.json.");
        const payload = await response.json();
        if (!payload?.data?.tabs) throw new Error("sheet-snapshot.json имеет неверный формат.");
        state.snapshotPayload = payload;
        return payload;
      }

      async function applyDefaultDatesFromSnapshot() {
        const payload = await getSnapshotPayload();
        const movementRows = payload?.data?.tabs?.movement?.values || [];
        const startIso = parseDisplayDateToIso(movementRows?.[0]?.[1]);
        const endIso = parseDisplayDateToIso(movementRows?.[0]?.[3]);
        const today = new Date().toISOString().slice(0, 10);
        elements.startDate.value = startIso || today;
        elements.endDate.value = endIso || today;
      }

      async function loadDashboardData() {
        const startDate = elements.startDate.value;
        const endDate = elements.endDate.value;
        if (!startDate || !endDate) {
          setStatus("Выберите обе даты.", true);
          return;
        }
        setLoading(true);
        setStatus("Загружаю данные...");
        try {
          state.data = await loadDashboardDataDirect(startDate, endDate);
          if (hasConfiguredManualFinanceEndpoint()) {
            await syncManualFinanceForCurrentPeriod();
            await syncManualTransfersForCurrentRange(startDate, endDate);
            await syncManualOrdersForCurrentRange(startDate, endDate);
          } else {
            state.manualFinance.data = null;
            state.manualTransfers.data = null;
            state.manualOrders.data = null;
          }
          await applyClientSideDerivedData(startDate, endDate);
          renderMetrics();
          renderTabs();
          setStatus(buildLoadedStatus());
        } catch (error) {
          setStatus(error.message || "Не удалось загрузить данные.", true);
        } finally {
          setLoading(false);
        }
      }

      async function loadDashboardDataDirect(startDate, endDate) {
        const endpoint = getDashboardEndpoint();
        if (endpoint) {
          try {
            const payload = await loadDashboardDataViaEndpoint(startDate, endDate);
            return buildPreparedDashboardData(payload, startDate, endDate);
          } catch (error) {
            console.warn("Dashboard endpoint failed, falling back to direct Sheets access.", error);
            if (!state.googleAuth.accessToken) throw error;
          }
        }

        const tabConfigs = state.config.tabs.filter((tab) => tab.id !== "manualFinance");
        const entries = await Promise.all(tabConfigs.map(async (tab) => {
          const values = await getSheetValuesByTitle(tab.sheetName, state.config.spreadsheetId);
          return [tab.id, { sheetName: tab.sheetName || tab.id, values, sourceType: "google-sheets-direct" }];
        }));
        return buildPreparedDashboardData({ tabs: Object.fromEntries(entries) }, startDate, endDate);
      }

      async function loadDashboardDataViaEndpoint(startDate, endDate) {
        const endpoint = getDashboardEndpoint();
        if (!endpoint) {
          throw new Error("Dashboard endpoint is not configured.");
        }
        const url = new URL(endpoint, window.location.href);
        url.searchParams.set("action", "getDashboardData");
        url.searchParams.set("startDate", startDate);
        url.searchParams.set("endDate", endDate);
        const response = await fetch(url.toString(), { cache: "no-store" });
        const payload = await response.json();
        if (!response.ok || !payload?.ok || !payload?.data?.tabs) {
          throw new Error(payload?.error || `Dashboard endpoint failed (${response.status}).`);
        }
        return payload.data;
      }

      function buildPreparedDashboardData(data, startDate, endDate) {
        const tabs = {};
        for (const tab of state.config.tabs) {
          if (tab.id === "manualFinance") continue;
          const rawTable = data?.tabs?.[tab.id];
          if (!rawTable) continue;
          const prepared = prepareTabValues(tab.id, rawTable.values || [], startDate, endDate);
          tabs[tab.id] = {
            sheetName: rawTable.sheetName || tab.sheetName || tab.id,
            values: prepared.values,
            summaryRows: prepared.summaryRows || [],
            headerRowIndex: prepared.headerRowIndex ?? 0,
            spreadsheetUrl: rawTable.spreadsheetUrl || "",
            sourceType: rawTable.sourceType || data?.sourceType || ""
          };
        }
        return {
          period: data?.period || { startDate: formatDisplayDate(startDate), endDate: formatDisplayDate(endDate) },
          tabs,
          fetchedAt: data?.fetchedAt || new Date().toLocaleString("ru-RU"),
          ordersSummary: data?.ordersSummary || undefined
        };
      }

      function renderTabs() {
        elements.tabs.innerHTML = "";
        elements.tabPanels.innerHTML = "";
        for (const tab of state.config.tabs) {
          const button = document.createElement("button");
          button.className = "tab" + (tab.id === state.activeTab ? " active" : "");
          button.type = "button";
          button.textContent = tab.label;
          button.addEventListener("click", () => {
            state.activeTab = tab.id;
            renderTabs();
          });
          elements.tabs.appendChild(button);

          const panel = document.createElement("section");
          panel.className = "tab-panel" + (tab.id === state.activeTab ? " active" : "");
          if (tab.id === "manualFinance") {
            panel.appendChild(renderManualFinanceBlock());
          } else if (tab.id === "savings") {
            panel.appendChild(renderManualTransfersBlock());
          } else if (tab.id === "orders") {
            panel.appendChild(renderManualOrdersBlock());
          } else {
            panel.appendChild(renderStandardTab(tab.id, tab.label));
          }
          elements.tabPanels.appendChild(panel);
        }
        refreshGoogleControlsVisibility();
      }

      function refreshGoogleControlsVisibility() {
        const shouldShow = state.activeTab === "manualFinance" || state.activeTab === "savings" || state.activeTab === "orders";
        const display = shouldShow ? "" : "none";
        elements.connectGoogleButton.style.display = display;
        elements.disconnectGoogleButton.style.display = display;
      }

      function renderStandardTab(tabId, label) {
        const block = document.createElement("div");
        const header = document.createElement("div");
        header.className = "tab-header";
        const sourceType = String(state.data?.tabs?.[tabId]?.sourceType || "").trim();
        const note = tabId === "savings"
          ? "Переводы за выбранный период читаются из workbook fact/Переводы."
          : (sourceType === "live-source-csv"
              ? "Актуальные данные загружаются сервером без Google-авторизации."
              : "Данные за выбранный период загружаются через серверный API. Google нужен только для ручных вкладок.");
        const titleWrap = document.createElement("div");
        const movementSourceUrl = tabId === "movement"
          ? getMovementSourceSpreadsheetUrl()
          : "";
        const manualWorkbookUrl = tabId === "savings"
          ? String(state.config?.manualFinance?.spreadsheetUrl || "").trim()
          : "";
        titleWrap.innerHTML = `<div><h2>${escapeHtml(label)}</h2><div class="tab-note">${escapeHtml(note)}${
          movementSourceUrl
            ? ` <a href="${escapeHtml(movementSourceUrl)}" target="_blank" rel="noreferrer">Открыть онлайн-документ источника</a>.`
            : ""
        }${
          manualWorkbookUrl
            ? ` <a href="${escapeHtml(manualWorkbookUrl)}" target="_blank" rel="noreferrer">Открыть workbook переводов</a>.`
            : ""
        }</div></div>`;
        header.appendChild(titleWrap);
        const headerActions = renderTabExportActions(tabId);
        if (headerActions.childNodes.length && tabId !== "movement") header.appendChild(headerActions);
        block.appendChild(header);
        if (tabId === "movement" && headerActions.childNodes.length) {
          headerActions.classList.add("movement-export-actions");
          block.appendChild(headerActions);
        }
        const wrap = document.createElement("div");
        wrap.className = "table-wrap";
        const values = tabId === "analytics"
          ? getAnalyticsMergedValues()
          : (state.data?.tabs?.[tabId]?.values || []);
        if (!values.length) {
          wrap.innerHTML = `<div class="empty">Нет данных для отображения.</div>`;
          block.appendChild(wrap);
          return block;
        }
        if (tabId === "analytics") {
          renderAnalyticsSections(wrap, values);
        } else {
          wrap.appendChild(renderResponsiveDataView(
            values,
            tabId === "movement" ? { mobileTableColumnCount: 7 } : { mobileTableColumnCount: 1 }
          ));
        }
        block.appendChild(wrap);
        if (tabId === "payouts") {
          const transfersBlock = renderPayoutTransfersBlock();
          if (transfersBlock) block.appendChild(transfersBlock);
        }
        return block;
      }

      function getMovementSourceSpreadsheetUrl() {
        return String(
          state.data?.tabs?.movement?.spreadsheetUrl ||
          MOVEMENT_SOURCE_SPREADSHEET_FALLBACK_URL
        ).trim();
      }

      function renderPlainTable(values) {
        const table = document.createElement("table");
        const tbody = document.createElement("tbody");
        values.forEach((row, rowIndex) => {
          const tr = document.createElement("tr");
          row.forEach((cell) => {
            const tag = rowIndex === 0 ? "th" : "td";
            const node = document.createElement(tag);
            node.textContent = formatCellForDisplay(cell);
            tr.appendChild(node);
          });
          tbody.appendChild(tr);
        });
        table.appendChild(tbody);
        return table;
      }

      function renderResponsiveDataView(values, options = {}) {
        const shell = document.createElement("div");
        const desktopTable = document.createElement("div");
        const mobileTableColumnCount = Number(options.mobileTableColumnCount || 0);
        desktopTable.className = "desktop-table";
        desktopTable.appendChild(renderPlainTable(values));
        shell.appendChild(desktopTable);

        if (mobileTableColumnCount > 0) {
          const mobileTable = document.createElement("div");
          mobileTable.className = "mobile-table";
          mobileTable.appendChild(renderPlainTable(values));
          shell.appendChild(mobileTable);
          return shell;
        }

        const mobileCards = renderMobileCards(values);
        if (mobileCards) shell.appendChild(mobileCards);
        return shell;
      }

      function renderMobileCards(values) {
        if (!Array.isArray(values) || values.length < 2) return null;
        const headers = (values[0] || []).map((cell) => String(cell || "").trim());
        const rows = values.slice(1).filter((row) => hasAnyValue(row));
        if (!rows.length) return null;
        const container = document.createElement("div");
        container.className = "mobile-cards";
        rows.forEach((row, rowIndex) => {
          const card = document.createElement("article");
          card.className = "mobile-card";
          const firstMeaningful = row.find((cell) => String(cell || "").trim()) || `Запись ${rowIndex + 1}`;
          const title = document.createElement("div");
          title.className = "mobile-card-title";
          title.textContent = String(firstMeaningful || `Запись ${rowIndex + 1}`);
          card.appendChild(title);

          const grid = document.createElement("div");
          grid.className = "mobile-card-grid";
          row.forEach((cell, cellIndex) => {
            const value = String(cell || "").trim();
            const label = String(headers[cellIndex] || "").trim();
            if (!value && !label) return;
            const item = document.createElement("div");
            item.className = "mobile-card-row";
            const labelNode = document.createElement("div");
            labelNode.className = "mobile-card-label";
            labelNode.textContent = label || `Колонка ${cellIndex + 1}`;
            const valueNode = document.createElement("div");
            valueNode.className = "mobile-card-value";
            valueNode.textContent = value || "—";
            item.append(labelNode, valueNode);
            grid.appendChild(item);
          });
          card.appendChild(grid);
          container.appendChild(card);
        });
        return container;
      }

              td.appendChild(input);

            tr.appendChild(td);
          });
          factBody.appendChild(tr);

        factTable.appendChild(factBody);
        factWrap.appendChild(factTable);

      function getServiceIncomeLookup() {

      function getManualFinanceDisplayHeaders(headers = MANUAL_FINANCE_HEADERS) {
        const source = Array.isArray(headers) && headers.length ? headers.slice() : MANUAL_FINANCE_HEADERS.slice();
        const hasServiceIncomeColumn = /(service|приход)/i.test(String(source[2] || "").trim());

        return [...base, "затраты-мои usd", "now_usd"];
      }

      function inferManualFinanceChannelCurrency(channel) {
        const normalized = String(channel || "").trim();
        if (!normalized) return "USD";
        if (ANALYTICS_PAYMENT_RULES[normalized]?.currency) return ANALYTICS_PAYMENT_RULES[normalized].currency;
        if (/руб/i.test(normalized)) return "RUB";
        if (/грн/i.test(normalized)) return "UAH";
        if (/(евр|eur|euro)/i.test(normalized)) return "EUR";
        if (/(cad|канада)/i.test(normalized)) return "CAD";
        if (/(дол|usd|binance|payoneer - dol|revolut)/i.test(normalized)) return "USD";
        return "LOCAL";
      }

      function buildManualFinanceUsdRateLookup(transferRows = [], movementValues = []) {
        const channelRates = {};
        const currencyRates = Object.fromEntries(
          Object.entries(MANUAL_FINANCE_FALLBACK_USD_RATES).map(([currency, rate]) => [currency, [rate]])
        );

        const addRate = (bucket, key, rate) => {
          if (!key || !Number.isFinite(rate) || rate <= 0) return;
          if (!bucket[key]) bucket[key] = [];
          bucket[key].push(rate);
        };

        normalizeManualFinanceTransferRows(transferRows, { padToMinimum: false }).forEach((row) => {
          const amount = parseLooseNumber(row.amount);
          const usdAmount = parseLooseNumber(row.usdAmount);
          const derivedRate = amount > 0 && usdAmount > 0 ? usdAmount / amount : 0;
          const channel = String(row.channel || "").trim();
          const currency = String(row.currency || "").trim().toUpperCase() || inferManualFinanceChannelCurrency(channel);
          addRate(channelRates, channel, derivedRate);
          addRate(currencyRates, currency, derivedRate);
        });

        const movementStats = calculateMovementChannelStats(movementValues);
        Object.keys(movementStats.localByChannel || {}).forEach((channel) => {
          const localValue = parseLooseNumber(movementStats.localByChannel?.[channel]);
          const usdValue = parseLooseNumber(movementStats.usdByChannel?.[channel]);
          const derivedRate = localValue > 0 && usdValue > 0 ? usdValue / localValue : 0;
          addRate(channelRates, channel, derivedRate);
          addRate(currencyRates, inferManualFinanceChannelCurrency(channel), derivedRate);
        });

        const average = (values) => values.reduce((sum, value) => sum + value, 0) / values.length;

        return {
          byChannel: Object.fromEntries(
            Object.entries(channelRates).map(([channel, values]) => [channel, average(values)])
          ),
          byCurrency: Object.fromEntries(
            Object.entries(currencyRates).map(([currency, values]) => [currency, average(values)])
          )
        };
      }

      function appendCollapsibleZeroAnalyticsTable(block, rows) {

      function splitAnalyticsSections(values) {
        const sections = [];
        let index = 0;
        while (index < values.length) {
          const title = String(values[index]?.[0] || "").trim();
          if (!title) { index += 1; continue; }
          const header = values[index + 1] || [];
          const rows = [];
          let cursor = index + 2;
          while (cursor < values.length && hasAnyValue(values[cursor])) {
            rows.push(values[cursor]);
            cursor += 1;
          }
          if (header.length) sections.push({ title, rows: [header, ...rows] });
          index = cursor + 1;
        }
        return sections;
      }

      function normalizePlanGrowthFormula(values) {
        const output = clone2dArray(values || []);
        const exchangeLookup = buildAnalyticsExchangeLookup(output);
        for (let index = 0; index < output.length; index += 1) {
          if (normalizeCell(output[index]?.[0]) !== normalizeCell("Plan")) continue;
          const header = output[index + 1] || [];
          let exchangeIndex = findHeaderIndexByAliases(header, ["обмен", "exchange", "комиссии"]);
          const hadLegacyCommissionColumn = exchangeIndex !== -1 && normalizeCell(header[exchangeIndex]) === normalizeCell("комиссии");
          if (exchangeIndex !== -1) header[exchangeIndex] = "обмен";
          if (exchangeIndex === -1) {
            const planGrowthIndex = findHeaderIndexByAliases(header, ["план-рост"]);
            exchangeIndex = planGrowthIndex === -1 ? header.length : planGrowthIndex;
            insertAnalyticsColumn(output, index + 1, exchangeIndex, "обмен");
          }
          let exchangeUsdIndex = findHeaderIndexByAliases(header, ["обмен_usd", "exchange_usd"]);
          if (exchangeUsdIndex === -1) {
            exchangeUsdIndex = exchangeIndex + 1;
            insertAnalyticsColumn(output, index + 1, exchangeUsdIndex, "обмен_usd");
          }
          const usdIndex = findHeaderIndexByAliases(header, ["пришло в долларах"]);
          const paidOutIndex = findHeaderIndexByAliases(header, ["ушло"]);
          const planGrowthIndex = findHeaderIndexByAliases(header, ["план-рост"]);
          const ownCostUsdIndex = findHeaderIndexByAliases(header, ["затраты-мои-дол", "затраты-мои usd"]);
          const planProfitIndex = findHeaderIndexByAliases(header, ["plan-profit"]);
          if (usdIndex === -1 || paidOutIndex === -1 || planGrowthIndex === -1) continue;
          let totalExchange = 0;
          let totalExchangeUsd = 0;
          let totalPaidOut = 0;
          let totalPlanGrowth = 0;
          let cursor = index + 2;
          while (cursor < output.length && hasAnyValue(output[cursor])) {
            const row = output[cursor];
            const label = normalizeCell(row[0]);
            if (label !== normalizeCell("Итого движение")) {
              const channel = String(row[0] || "").trim();
              const lookup = exchangeLookup[channel] || {};
              if ((hadLegacyCommissionColumn || !String(row[exchangeIndex] ?? "").trim()) && lookup.exchange !== undefined) {
                row[exchangeIndex] = formatSheetNumber(lookup.exchange);
              }
              if ((hadLegacyCommissionColumn || !String(row[exchangeUsdIndex] ?? "").trim()) && lookup.exchangeUsd !== undefined) {
                row[exchangeUsdIndex] = formatSheetNumber(lookup.exchangeUsd);
              }
              const exchange = parseLooseNumber(row[exchangeIndex]);
              const exchangeUsd = parseLooseNumber(row[exchangeUsdIndex]);
              const paidOut = normalizePayoutAmount(row[paidOutIndex]);
              row[paidOutIndex] = formatSheetNumber(paidOut);
              const planGrowth = parseLooseNumber(row[usdIndex]) + paidOut + exchangeUsd;
              row[planGrowthIndex] = formatSheetNumber(planGrowth);
              if (planProfitIndex !== -1 && ownCostUsdIndex !== -1) {
                row[planProfitIndex] = formatSheetNumber(planGrowth - parseLooseNumber(row[ownCostUsdIndex]));
              }
              if (label !== normalizeCell(MANUAL_FINANCE_TOTAL_LABEL)) {
                totalExchange += exchange;
                totalExchangeUsd += exchangeUsd;
                totalPaidOut += paidOut;
                totalPlanGrowth += planGrowth;
              } else {
                row[paidOutIndex] = formatSheetNumber(totalPaidOut);
                row[exchangeIndex] = formatSheetNumber(totalExchange);
                row[exchangeUsdIndex] = formatSheetNumber(totalExchangeUsd);
                row[planGrowthIndex] = formatSheetNumber(totalPlanGrowth);
                if (planProfitIndex !== -1 && ownCostUsdIndex !== -1) {
                  row[planProfitIndex] = formatSheetNumber(totalPlanGrowth - parseLooseNumber(row[ownCostUsdIndex]));
                }
              }
            }
            cursor += 1;
          }
        }
        return output;
      }

      function insertAnalyticsColumn(values, headerRowIndex, columnIndex, headerLabel) {
        values[headerRowIndex].splice(columnIndex, 0, headerLabel);
        let cursor = headerRowIndex + 1;
        while (cursor < values.length && hasAnyValue(values[cursor])) {
          values[cursor].splice(columnIndex, 0, "");
          cursor += 1;
        }
      }

      function buildAnalyticsExchangeLookup(values) {
        const lookup = {};
        const sections = splitAnalyticsSections(values || []);
        sections.forEach((section) => {
          const header = section.rows?.[0] || [];
          const channelIndex = findHeaderIndexByAliases(header, ["канал", "валюта"]);
          const exchangeIndex = findHeaderIndexByAliases(header, ["обмен", "exchange"]);
          if (channelIndex === -1 || exchangeIndex === -1) return;
          const exchangeUsdIndex = findHeaderIndexByAliases(header, ["обмен_usd", "exchange_usd"]);
          const totalIndex = findHeaderIndexByAliases(header, ["затраты-мои"]);
          const totalUsdIndex = findHeaderIndexByAliases(header, ["затраты-мои usd", "затраты-мои-дол"]);
          section.rows.slice(1).forEach((row) => {
            const channel = String(row[channelIndex] || "").trim();
            if (!channel || normalizeCell(channel) === normalizeCell(MANUAL_FINANCE_TOTAL_LABEL)) return;
            const exchange = parseLooseNumber(row[exchangeIndex]);
            let exchangeUsd = exchangeUsdIndex !== -1 ? parseLooseNumber(row[exchangeUsdIndex]) : 0;
            const total = totalIndex !== -1 ? parseLooseNumber(row[totalIndex]) : 0;
            const totalUsd = totalUsdIndex !== -1 ? parseLooseNumber(row[totalUsdIndex]) : 0;
            if (!exchangeUsd && exchange && total && totalUsd) exchangeUsd = exchange * totalUsd / total;
            if (!exchangeUsd && exchange && inferManualFinanceChannelCurrency(channel) === "USD") exchangeUsd = exchange;
            lookup[channel] = { exchange, exchangeUsd };
          });
        });
        return lookup;
      }

      function getAnalyticsSections(values) {
        const sections = splitAnalyticsSections(normalizePlanGrowthFormula(values));
        const movementSummaryRows = state.data?.tabs?.movement?.summaryRows || [];
        const output = movementSummaryRows.length
          ? [
              {
                title: "Итоги за выбранный период",
                rows: [["Показатель", "Значение"], ...clone2dArray(movementSummaryRows)]
              },
              ...sections
            ]
          : sections.slice();
        const savingsValues = clone2dArray(state.data?.tabs?.savings?.values || []);
        if (savingsValues.length) {
          output.push({
            title: "Сбережения",
            rows: savingsValues
          });
        }
        return output;
      }

      function getManualFinanceChannels() {
        return Array.isArray(state.config?.manualFinance?.channels) && state.config.manualFinance.channels.length
          ? state.config.manualFinance.channels.slice()
          : MANUAL_FINANCE_MONEY_CHANNELS.slice();
      }

      function getManualExpenseTypes() {
        return Array.isArray(state.config?.manualFinance?.expenseTypes) && state.config.manualFinance.expenseTypes.length
          ? state.config.manualFinance.expenseTypes.slice()
          : MANUAL_INPUT_CATEGORIES.slice();
      }

      function getManualStoredExpenseTypes() {
        return [...new Set([...MANUAL_STORED_INPUT_CATEGORIES, ...getManualExpenseTypes()])];
      }

      function buildManualExpenseHeaders() {
        return ["дата", "категория", ...getManualFinanceChannels()];
      }

      function buildEmptyExpenseAmounts() {
        return Object.fromEntries(getManualFinanceChannels().map((channel) => [channel, ""]));
      }

      function createEmptyManualFinanceTransferRow() {
        return { transferDate: "", who: "", amount: "", currency: "", channel: "", rate: "", usdAmount: "" };
      }

      function createManualFinanceExpenseRow(date, category) {
        return { date, category, amounts: buildEmptyExpenseAmounts() };
      }

      function createLegacyFactMoneyRow(channel = "") {
        return { channel, now: "", serviceIncome: "", business: "", food: "", house: "", study: "", travelFun: "", total: "", exchange: "", nowUsd: "" };
      }

      const MANUAL_FINANCE_FORMULA_KEY_BY_COLUMN = {
        A: "channel",
        B: "now",
        C: "serviceIncome",
        D: "business",
        E: "house",
        F: "food",
        G: "study",
        H: "travelFun",
        I: "total",
        J: "exchange"
      };
      const MANUAL_FINANCE_FORMULA_ROW_OFFSET = 3;

      function getManualFinanceFormulaOptions() {
        return {
          formulaKeyByColumn: MANUAL_FINANCE_FORMULA_KEY_BY_COLUMN,
          formulaRowOffset: MANUAL_FINANCE_FORMULA_ROW_OFFSET,
          parseLooseNumber,
          roundTo2
        };
      }

      function isManualFinanceFormula(value) {
        return MANUAL_FINANCE_FORMULAS.isManualFinanceFormula
          ? MANUAL_FINANCE_FORMULAS.isManualFinanceFormula(value)
          : /^\s*=/.test(String(value ?? ""));
      }

      function evaluateManualFinanceFormula(rawValue, rows, visited = new Set()) {
        if (!MANUAL_FINANCE_FORMULAS.evaluateManualFinanceFormula) return null;
        return MANUAL_FINANCE_FORMULAS.evaluateManualFinanceFormula(
          rawValue,
          rows,
          getManualFinanceFormulaOptions(),
          visited
        );
      }

      function evaluateManualFinanceCellNumericValue(rows, rowIndex, key, visited = new Set()) {
        if (!MANUAL_FINANCE_FORMULAS.evaluateManualFinanceCellNumericValue) {
          const row = rows?.[rowIndex];
          return row ? parseLooseNumber(row[key]) : 0;
        }
        return MANUAL_FINANCE_FORMULAS.evaluateManualFinanceCellNumericValue(
          rows,
          rowIndex,
          key,
          getManualFinanceFormulaOptions(),
          visited
        );
      }

      function normalizeManualFinancePersistedNumberInput(value, options = {}) {
        if (!MANUAL_FINANCE_FORMULAS.normalizeManualFinancePersistedNumberInput) {
          return normalizeManualFinanceNumberInput(value);
        }
        return MANUAL_FINANCE_FORMULAS.normalizeManualFinancePersistedNumberInput(value, {
          ...getManualFinanceFormulaOptions(),
          ...options
        });
      }

      function getManualFinanceComputedAmount(value, options = {}) {
        return parseLooseNumber(normalizeManualFinancePersistedNumberInput(value, options));
      }

      function calculateLegacyFactRowTotal(row, rows, rowIndex) {
        return formatSheetNumber(
          evaluateManualFinanceCellNumericValue(rows, rowIndex, "business") +
          evaluateManualFinanceCellNumericValue(rows, rowIndex, "food") +
          evaluateManualFinanceCellNumericValue(rows, rowIndex, "house") +
          evaluateManualFinanceCellNumericValue(rows, rowIndex, "study") +
          evaluateManualFinanceCellNumericValue(rows, rowIndex, "travelFun")
        );
      }

      function normalizeManualFinanceMoneyRows(rows = []) {
        const lookup = new Map();
        (rows || []).forEach((row) => {
          const channel = String(row?.channel || "").trim();
          if (!channel) return;
          lookup.set(channel, {
            channel,
            now: row?.now ?? "",
            nowUsd: row?.nowUsd ?? row?.now_usd ?? "",
            serviceIncome: row?.serviceIncome ?? "",
            business: row?.business ?? "",
            food: row?.food ?? "",
            house: row?.house ?? row?.flat ?? "",
            study: row?.study ?? row?.fun ?? "",
            travelFun: row?.travelFun ?? row?.travel ?? "",
            exchange: row?.exchange ?? "",
            total: row?.total ?? ""
          });
        });
        const normalized = MANUAL_FINANCE_MONEY_CHANNELS.map((channel) => {
          const row = lookup.get(channel) || createLegacyFactMoneyRow(channel);
          return {
            ...row,
            channel,
            nowUsd: row?.nowUsd ?? "",
            total: row?.total ?? ""
          };
        });
        normalized.forEach((row, rowIndex) => {
          row.total = calculateLegacyFactRowTotal(row, normalized, rowIndex);
        });
        normalized.push({
          channel: MANUAL_FINANCE_TOTAL_LABEL,
          now: formatSheetNumber(normalized.reduce((sum, row, rowIndex) => sum + evaluateManualFinanceCellNumericValue(normalized, rowIndex, "now"), 0)),
          nowUsd: formatSheetNumber(normalized.reduce((sum, row) => sum + parseLooseNumber(row.nowUsd), 0)),
          serviceIncome: formatSheetNumber(normalized.reduce((sum, row, rowIndex) => sum + evaluateManualFinanceCellNumericValue(normalized, rowIndex, "serviceIncome"), 0)),
          business: formatSheetNumber(normalized.reduce((sum, row, rowIndex) => sum + evaluateManualFinanceCellNumericValue(normalized, rowIndex, "business"), 0)),
          food: formatSheetNumber(normalized.reduce((sum, row, rowIndex) => sum + evaluateManualFinanceCellNumericValue(normalized, rowIndex, "food"), 0)),
          house: formatSheetNumber(normalized.reduce((sum, row, rowIndex) => sum + evaluateManualFinanceCellNumericValue(normalized, rowIndex, "house"), 0)),
          study: formatSheetNumber(normalized.reduce((sum, row, rowIndex) => sum + evaluateManualFinanceCellNumericValue(normalized, rowIndex, "study"), 0)),
          travelFun: formatSheetNumber(normalized.reduce((sum, row, rowIndex) => sum + evaluateManualFinanceCellNumericValue(normalized, rowIndex, "travelFun"), 0)),
          exchange: formatSheetNumber(normalized.reduce((sum, row, rowIndex) => sum + evaluateManualFinanceCellNumericValue(normalized, rowIndex, "exchange"), 0)),
          total: formatSheetNumber(normalized.reduce((sum, row, rowIndex) => sum + evaluateManualFinanceCellNumericValue(normalized, rowIndex, "total"), 0))
        });
        return normalized;
      }

      function buildLegacyFactMoneyRowsFromExpenseRows(expenseRows) {
        const channelRows = getManualFinanceChannels().map((channel) => createLegacyFactMoneyRow(channel));
        expenseRows.forEach((row) => {
          const targetField = ({
            now: "now",
            serviceIncome: "serviceIncome",
            business: "business",
            flat: "house",
            food: "food",
            fun: "study",
            travel: "travelFun",
            exchange: "exchange"
          })[row.category];
          if (!targetField) return;
          channelRows.forEach((target) => {
            target[targetField] = formatSheetNumber(
              getManualFinanceComputedAmount(target[targetField]) +
              getManualFinanceComputedAmount(row.amounts?.[target.channel])
            );
          });
        });
        return normalizeManualFinanceMoneyRows(channelRows);
      }

      function convertLegacyFactMoneyRowsToExpenseRows(moneyRows, periodEnd) {
        const normalized = normalizeManualFinanceMoneyRows(moneyRows);
        const rowIndexByChannel = Object.fromEntries(
          normalized
            .map((row, rowIndex) => [String(row.channel || "").trim(), rowIndex])
            .filter(([channel]) => channel && channel !== MANUAL_FINANCE_TOTAL_LABEL)
        );
        const expenseLookup = Object.fromEntries(
          MANUAL_STORED_INPUT_CATEGORIES.map((category) => [category, createManualFinanceExpenseRow(periodEnd, category)])
        );
        normalized.forEach((row) => {
          const channel = String(row.channel || "").trim();
          if (!channel || channel === MANUAL_FINANCE_TOTAL_LABEL) return;
          const rowIndex = rowIndexByChannel[channel];
          expenseLookup[MANUAL_NOW_CATEGORY].amounts[channel] = formatSheetNumber(evaluateManualFinanceCellNumericValue(normalized, rowIndex, "now"));
          expenseLookup.serviceIncome.amounts[channel] = formatSheetNumber(evaluateManualFinanceCellNumericValue(normalized, rowIndex, "serviceIncome"));
          expenseLookup.business.amounts[channel] = formatSheetNumber(evaluateManualFinanceCellNumericValue(normalized, rowIndex, "business"));
          expenseLookup.flat.amounts[channel] = formatSheetNumber(evaluateManualFinanceCellNumericValue(normalized, rowIndex, "house"));
          expenseLookup.food.amounts[channel] = formatSheetNumber(evaluateManualFinanceCellNumericValue(normalized, rowIndex, "food"));
          expenseLookup.fun.amounts[channel] = formatSheetNumber(evaluateManualFinanceCellNumericValue(normalized, rowIndex, "study"));
          expenseLookup.travel.amounts[channel] = formatSheetNumber(evaluateManualFinanceCellNumericValue(normalized, rowIndex, "travelFun"));
          expenseLookup[MANUAL_EXCHANGE_CATEGORY].amounts[channel] = formatSheetNumber(evaluateManualFinanceCellNumericValue(normalized, rowIndex, "exchange"));
        });
        return MANUAL_STORED_INPUT_CATEGORIES.map((category) => expenseLookup[category]);
      }

      function buildAnalyticsManualRowsFromFactMoneyRows(moneyRows, transferRows = []) {
        const usdRateLookup = buildManualFinanceUsdRateLookup(transferRows, state.data?.tabs?.movement?.values || []);
        return normalizeManualFinanceMoneyRows(moneyRows).map((row) => ({
          channel: row.channel,
          now: row.now,
          serviceIncome: row.serviceIncome,
          business: row.business,
          flat: row.house,
          food: row.food,
          fun: row.study,
          travel: row.travelFun,
          total: row.total,
          exchange: row.exchange,
          totalUsd: getManualFinanceTotalUsdValue(row, usdRateLookup),
          nowUsd: getManualFinanceNowUsdValue(row, usdRateLookup)
        }));
      }

      function getLatestFactNowLookup() {
        const lookup = {};
        if (state.data?.tabs?.savings?.values?.length) {
          Object.assign(lookup, buildSavingsLookupFromValues(state.data.tabs.savings.values));
        }
        if (state.manualFinance.data?.moneyRows?.length) {
          normalizeManualFinanceMoneyRows(state.manualFinance.data.moneyRows).forEach((row) => {
            if (!row || row.channel === MANUAL_FINANCE_TOTAL_LABEL) return;
            const raw = String(row.now ?? "").trim();
            if (raw) lookup[row.channel] = parseLooseNumber(raw);
          });
        }
        return lookup;
      }

      function buildSavingsLookupFromValues(values) {
        if (!values.length) return {};
        const lookup = {};
        values.slice(1).forEach((row) => {
          if (!hasAnyValue(row)) return;
          const channel = String(row[0] || "").trim();
          if (!channel || normalizeCell(channel) === normalizeCell("итого")) return;
          lookup[channel] = row.length > 3 && String(row[3] ?? "").trim()
            ? parseLooseNumber(row[3])
            : parseLooseNumber(row[1]);
        });
        return lookup;
      }

      function applySavingsLookupToMoneyRows(moneyRows, lookup) {
        const normalized = normalizeManualFinanceMoneyRows(moneyRows);
        normalized.forEach((row) => {
          if (!row || row.channel === MANUAL_FINANCE_TOTAL_LABEL) return;
          if (Object.prototype.hasOwnProperty.call(lookup, row.channel)) {
            row.now = formatSheetNumber(lookup[row.channel]);
          }
        });
        return normalizeManualFinanceMoneyRows(normalized);
      }

      function getSavingsTabConfig() {
        return (state.config?.tabs || []).find((tab) => tab.id === "savings") || null;
      }

      async function hydrateManualFinanceNowFromSavings(manualData) {
        return manualData;
      }

      function buildMainAnalyticsFactImportValues(moneyRows, transferRows = []) {
        const normalized = normalizeManualFinanceMoneyRows(moneyRows);
        const usdRateLookup = buildManualFinanceUsdRateLookup(transferRows, state.data?.tabs?.movement?.values || []);
        return [
          ["валюта", "now", "service income", "spent for business", "spent for food", "spent for house", "spent for study", "spent for travel/ fun", "затраты-мои", "обмен", "now_usd"],
          ...normalized
            .filter((row) => row.channel !== MANUAL_FINANCE_TOTAL_LABEL)
            .map((row, rowIndex) => [
              row.channel || "",
              normalizeManualFinancePersistedNumberInput(row.now, { rows: normalized, rowIndex, key: "now" }),
              normalizeManualFinancePersistedNumberInput(row.serviceIncome, { rows: normalized, rowIndex, key: "serviceIncome" }),
              normalizeManualFinancePersistedNumberInput(row.business, { rows: normalized, rowIndex, key: "business" }),
              normalizeManualFinancePersistedNumberInput(row.food, { rows: normalized, rowIndex, key: "food" }),
              normalizeManualFinancePersistedNumberInput(row.house, { rows: normalized, rowIndex, key: "house" }),
              normalizeManualFinancePersistedNumberInput(row.study, { rows: normalized, rowIndex, key: "study" }),
              normalizeManualFinancePersistedNumberInput(row.travelFun, { rows: normalized, rowIndex, key: "travelFun" }),
              row.total || "",
              normalizeManualFinancePersistedNumberInput(row.exchange, { rows: normalized, rowIndex, key: "exchange" }),
              getManualFinanceNowUsdValue(row, usdRateLookup)
            ])
        ];
      }

      async function syncMainAnalyticsFactImportFromMoneyRows(moneyRows, transferRows = []) {
        if (!state.config?.spreadsheetId) return null;
        const values = buildMainAnalyticsFactImportValues(moneyRows, transferRows);
        await overwriteSheetValues(ANALYTICS_FACT_IMPORT_SHEET, values, state.config.spreadsheetId);
        return values;
      }

      function buildFactImportLookupFromValues(values) {
        const header = values?.[0] || [];
        const channelIndex = findHeaderIndexByAliases(header, ["валюта", "канал"]);
        const nowIndex = findHeaderIndexByAliases(header, ["now"]);
        const serviceIncomeIndex = findHeaderIndexByAliases(header, ["service income", "приход от услуг"]);
        const businessIndex = findHeaderIndexByAliases(header, ["spent for business"]);
        const foodIndex = findHeaderIndexByAliases(header, ["spent for food"]);
        const houseIndex = findHeaderIndexByAliases(header, ["spent for house", "spent for flat"]);
        const studyIndex = findHeaderIndexByAliases(header, ["spent for study", "spent for fun"]);
        const travelFunIndex = findHeaderIndexByAliases(header, ["spent for travel/ fun", "spent for travel"]);
        const exchangeIndex = findHeaderIndexByAliases(header, ["обмен", "exchange"]);
        const lookup = {};
        (values || []).slice(1).forEach((row) => {
          const channel = String(row?.[channelIndex] || "").trim();
          if (!channel || normalizeCell(channel) === normalizeCell(MANUAL_FINANCE_TOTAL_LABEL)) return;
          lookup[channel] = {
            now: nowIndex !== -1 ? (row[nowIndex] || "") : "",
            serviceIncome: serviceIncomeIndex !== -1 ? (row[serviceIncomeIndex] || "") : "",
            business: businessIndex !== -1 ? (row[businessIndex] || "") : "",
            food: foodIndex !== -1 ? (row[foodIndex] || "") : "",
            house: houseIndex !== -1 ? (row[houseIndex] || "") : "",
            study: studyIndex !== -1 ? (row[studyIndex] || "") : "",
            travelFun: travelFunIndex !== -1 ? (row[travelFunIndex] || "") : "",
            exchange: exchangeIndex !== -1 ? (row[exchangeIndex] || "") : ""
          };
        });
        return lookup;
      }

      function applyFactImportLookupToMoneyRows(moneyRows, lookup) {
        const normalized = normalizeManualFinanceMoneyRows(moneyRows);
        normalized.forEach((row) => {
          if (!row || row.channel === MANUAL_FINANCE_TOTAL_LABEL) return;
          const imported = lookup[row.channel];
          if (!imported) return;
          ["now", "serviceIncome", "business", "food", "house", "study", "travelFun", "exchange"].forEach((key) => {
            if (String(imported[key] ?? "").trim()) row[key] = imported[key];
          });
        });
        return normalizeManualFinanceMoneyRows(normalized);
      }

      async function hydrateManualFinanceFromMainFactImport(manualData) {
        if (!manualData || !state.config?.spreadsheetId) return manualData;
        if (manualData.sourceType === "incoming-repository" || manualData.emptyFact) return manualData;
        let values = [];
        try {
          values = await getSheetValuesByTitle(ANALYTICS_FACT_IMPORT_SHEET, state.config.spreadsheetId);
        } catch (error) {
          console.warn("Unable to hydrate fact values from main analytics import:", error);
        }
        const lookup = buildFactImportLookupFromValues(values);
        if (Object.keys(lookup).length) {
          manualData.moneyRows = applyFactImportLookupToMoneyRows(manualData.moneyRows, lookup);
        }
        return manualData;
      }

      function buildSavingsSheetValuesFromFactRows(existingValues, moneyRows, snapshotDate) {
        const rows = clone2dArray(existingValues || []);
        const header = rows[0]?.length ? rows[0].slice(0, 5) : ["валюта", 0, "", "now usd", "note / source"];
        while (header.length < 5) header.push("");
        header[0] = header[0] || "валюта";
        header[3] = header[3] || "now usd";
        header[4] = header[4] || "note / source";

        const channelIndex = new Map();
        for (let index = 1; index < rows.length; index += 1) {
          const channel = String(rows[index]?.[0] || "").trim();
          if (channel) channelIndex.set(channel, index);
        }

        const factRows = normalizeManualFinanceMoneyRows(moneyRows).filter((row) => row.channel !== MANUAL_FINANCE_TOTAL_LABEL);
        const result = [header];
        let totalNow = 0;
        factRows.forEach((row) => {
          const existingRow = channelIndex.has(row.channel) ? rows[channelIndex.get(row.channel)] : [];
          const nextRow = existingRow.slice(0, 5);
          while (nextRow.length < 5) nextRow.push("");
          const nowValue = parseLooseNumber(row.now);
          totalNow += nowValue;
          nextRow[0] = row.channel;
          nextRow[1] = nowValue;
          nextRow[2] = nextRow[2] || "";
          nextRow[3] = nowValue;
          nextRow[4] = `fact ${snapshotDate}`;
          result.push(nextRow);
        });
        result[0][1] = totalNow;
        result.push(["итого", totalNow]);
        return result;
      }

      async function syncSavingsSheetFromFact(moneyRows, snapshotDate) {
        const savingsTab = getSavingsTabConfig();
        if (!savingsTab?.sheetName || !state.config?.spreadsheetId) return null;
        const existingValues = await getSheetValuesByTitle(savingsTab.sheetName, state.config.spreadsheetId);
        const nextValues = buildSavingsSheetValuesFromFactRows(existingValues, moneyRows, snapshotDate);
        await overwriteSheetValues(savingsTab.sheetName, nextValues, state.config.spreadsheetId);
        if (!state.data) state.data = { tabs: {} };
        if (!state.data.tabs) state.data.tabs = {};
        state.data.tabs.savings = { ...(state.data.tabs.savings || {}), values: nextValues };
        return nextValues;
      }

      function buildAnalyticsTransfersFromFactRows(rows) {
        return normalizeManualFinanceTransferRows(rows, { padToMinimum: false })
          .filter((row) => Object.values(row).some((value) => String(value || "").trim()))
          .map((row) => ({
            date: row.transferDate || row.date || "",
            who: row.who || "",
            amount: row.amount || "",
            localCurrency: row.currency || row.localCurrency || "",
            rate: row.rate || "",
            usdAmount: row.usdAmount || "",
            destination: row.channel || row.destination || ""
          }));
      }

      function buildDefaultManualExpenseRows(startDate, endDate) {
        const rows = [];
        const current = parseIsoDate(startDate);
        const limit = parseIsoDate(endDate);
        while (current <= limit) {
          const isoDate = current.toISOString().slice(0, 10);
          getManualStoredExpenseTypes().forEach((category) => rows.push(createManualFinanceExpenseRow(isoDate, category)));
          current.setUTCDate(current.getUTCDate() + 1);
        }
        return rows;
      }

      function normalizeManualFinanceTransferRows(rows, options = {}) {
        const padToMinimum = options.padToMinimum !== false;
        const normalized = (rows || []).map((row) => ({
          transferDate: row?.transferDate ?? row?.date ?? "",
          who: row?.who ?? "",
          amount: row?.amount ?? "",
          currency: row?.currency ?? row?.localCurrency ?? "",
          channel: row?.channel ?? row?.destination ?? "",
          rate: row?.rate ?? "",
          usdAmount: row?.usdAmount ?? ""
        }));
        if (padToMinimum) {
          while (normalized.length < MANUAL_TRANSFER_MIN_ROWS) normalized.push(createEmptyManualFinanceTransferRow());
        }
        return normalized;
      }

      function normalizeManualFinanceExpenseRows(rows, startDate, endDate) {
        const index = new Map();
        (rows || []).forEach((row) => {
          if (!row?.date || !row?.category) return;
          const amounts = buildEmptyExpenseAmounts();
          getManualFinanceChannels().forEach((channel) => {
            amounts[channel] = row?.amounts?.[channel] ?? "";
          });
          index.set(`${row.date}|${row.category}`, { date: row.date, category: row.category, amounts });
        });
        return buildDefaultManualExpenseRows(startDate, endDate).map(
          (row) => index.get(`${row.date}|${row.category}`) || row
        );
      }

      function buildManualFinanceSummaryRows(expenseRows) {
        const channelRows = getManualFinanceChannels().map((channel) => ({
          channel,
          now: 0,
          serviceIncome: 0,
          business: 0,
          flat: 0,
          food: 0,
          fun: 0,
          travel: 0,
          total: 0,
          exchange: 0
        }));
        expenseRows.forEach((row) => {
          if (!getManualStoredExpenseTypes().includes(row.category)) return;
          channelRows.forEach((target) => {
            const amount = getManualFinanceComputedAmount(row.amounts?.[target.channel]);
            if (row.category === MANUAL_NOW_CATEGORY) {
              target.now += amount;
              return;
            }
            if (row.category === MANUAL_EXCHANGE_CATEGORY) {
              target.exchange += amount;
              return;
            }
            target[row.category] += amount;
            if (row.category !== "serviceIncome") target.total += amount;
          });
        });
        const formatted = channelRows.map((row) => ({
          channel: row.channel,
          now: formatSheetNumber(row.now),
          serviceIncome: formatSheetNumber(row.serviceIncome),
          business: formatSheetNumber(row.business),
          flat: formatSheetNumber(row.flat),
          food: formatSheetNumber(row.food),
          fun: formatSheetNumber(row.fun),
          travel: formatSheetNumber(row.travel),
          exchange: formatSheetNumber(row.exchange),
          total: formatSheetNumber(row.total)
        }));
        formatted.push({
          channel: MANUAL_FINANCE_TOTAL_LABEL,
